/* Layout: one-screen phone column on bathhouse tiles — neon shop sign, paper service ticket, canvas stage, wooden tool tray */
:root{
  --tile:#3a8a7f; --tile-line:#2f7268; --deep:#163a35;
  --wood:#c08447; --wood-dark:#6f4220; --wood-light:#e4b57c;
  --sign:#c4302a; --gold:#f5c95c; --paper:#fbf4e4; --paper-line:#e2d3b4;
  --ink:#2b2118; --ink-soft:#6b5a48;
  --good:#3f9d4a; --warn:#e08a1e; --bad:#c4302a;
  --display:'ZCOOL KuaiLe','Hiragino Sans GB','PingFang SC','Microsoft YaHei',sans-serif;
  --body:'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;
  color-scheme: light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--deep);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-color:var(--tile);
  background-image:linear-gradient(var(--tile-line) 2px,transparent 2px),linear-gradient(90deg,var(--tile-line) 2px,transparent 2px);
  background-size:34px 34px;background-position:-1px -1px}

/* header */
.top{display:flex;align-items:center;gap:8px;min-width:0}
.sign small{font-size:11px;letter-spacing:.15em;margin-left:4px;opacity:.85;vertical-align:middle}
.stats .chip{white-space:nowrap}
.sign{background:var(--sign);color:var(--gold);font-family:var(--display);font-size:22px;letter-spacing:.08em;padding:3px 12px 4px;border-radius:8px;
  border:2px solid var(--gold);box-shadow:0 0 0 3px var(--sign),0 0 14px rgba(245,201,92,.45);text-shadow:0 0 6px rgba(245,201,92,.7);white-space:nowrap}
.stats{margin-left:auto;display:flex;gap:6px;align-items:center}
.chip{background:rgba(22,58,53,.75);color:var(--paper);padding:4px 10px;border-radius:999px;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.coin{background:var(--gold);color:var(--ink);font-weight:700}
.chip.coin.pop{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.25)}}
.icon-btn{width:32px;height:32px;border-radius:50%;border:0;background:rgba(22,58,53,.75);color:var(--paper);display:grid;place-items:center;flex:none}

/* ticket */
.ticket{background:var(--paper);border-radius:4px 4px 10px 10px;padding:8px 12px 10px;box-shadow:0 3px 0 rgba(0,0,0,.18);position:relative;display:flex;flex-direction:column;gap:6px}
.ticket::before{content:"";position:absolute;left:0;right:0;top:-5px;height:6px;background:radial-gradient(circle at 5px 0,transparent 4px,var(--paper) 4.5px) 0 0/10px 6px repeat-x}
.t-head{display:flex;align-items:baseline;gap:8px}
.tag{font-size:11px;background:var(--wood-dark);color:var(--paper);padding:1px 6px;border-radius:3px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.t-head b{font-family:var(--display);font-size:19px;font-weight:400}
.kind{font-family:var(--body);font-size:12px;color:var(--ink-soft);margin-left:6px;font-weight:400}
.t-count{margin-left:auto;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.quote{margin:0;font-size:14px;color:var(--ink);min-height:1.4em;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.st{font-size:12px;padding:2px 8px;border-radius:999px;border:1.5px dashed var(--paper-line);color:var(--ink-soft);display:inline-flex;align-items:center;gap:4px}
.st.cur{border-style:solid;border-color:var(--sign);color:var(--sign);font-weight:700}
.st.done{background:var(--good);border-color:var(--good);color:#fff;border-style:solid}
.st i{width:9px;height:9px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.25)}
.pat{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-soft)}
.bar{flex:1;height:8px;background:var(--paper-line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--good);border-radius:4px;transition:background .3s}

/* stage */
.stage{flex:1;min-height:0;position:relative}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.instr{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);background:rgba(22,40,36,.82);color:var(--paper);padding:6px 14px 7px;border-radius:12px;font-size:13px;
  text-align:center;width:max-content;max-width:94%;pointer-events:none;display:flex;flex-direction:column;gap:5px;line-height:1.35}
.instr.flash{animation:shk .35s}
@keyframes shk{25%{transform:translateX(calc(-50% - 6px))}75%{transform:translateX(calc(-50% + 6px))}}
.prog{height:6px;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--gold)}
.swatches{position:absolute;top:4px;right:0;display:flex;flex-direction:column;gap:6px}
.sw{display:flex;align-items:center;gap:6px;background:var(--paper);border:2px solid transparent;border-radius:999px;padding:3px 10px 3px 4px;font-size:12px;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.sw span{width:20px;height:20px;border-radius:50%;border:1.5px solid rgba(0,0,0,.25)}
.sw.sel{border-color:var(--sign);font-weight:700}

.tags{display:flex;flex-wrap:wrap;gap:5px}

.row .dots{flex:1;border-bottom:1.5px dotted var(--paper-line);transform:translateY(-4px)}
.row.total{font-family:var(--display);font-size:22px;color:var(--sign)}
.row .x{color:var(--ink-soft);font-size:12px}
.stars{font-size:26px;color:var(--gold);letter-spacing:4px;text-shadow:0 1px 0 var(--wood-dark)}
.say{background:#fff;border-radius:12px;padding:8px 12px;font-size:14px;position:relative;border:1.5px solid var(--paper-line)}
.shop{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;border:1.5px solid var(--paper-line);border-radius:10px;padding:8px 10px}
.item b{font-size:15px}
.item .d{font-size:12px;color:var(--ink-soft);grid-column:1}
.pips{display:flex;gap:3px;grid-column:1}
.pips i{width:14px;height:5px;border-radius:2px;background:var(--paper-line)}
.pips i.on{background:var(--good)}
.buy{grid-row:1/4;grid-column:2;border:0;border-radius:8px;padding:8px 10px;background:var(--gold);font-weight:700;font-variant-numeric:tabular-nums;box-shadow:0 2px 0 var(--wood-dark);min-width:68px}
.buy[disabled]{background:var(--paper-line);color:var(--ink-soft);box-shadow:none;cursor:not-allowed}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:430px){.sign{font-size:18px;padding:2px 8px 3px;letter-spacing:.04em}.sign small{font-size:10px;margin-left:2px}.stats{gap:4px}.chip{padding:4px 7px;font-size:12px}.icon-btn{width:28px;height:28px}.top{gap:6px}}

#app[data-ch]{background-size:cover;background-position:center bottom;background-repeat:no-repeat}
#app[data-ch="1"]{background-color:#e9cfa6;background-image:var(--bg1)}
#app[data-ch="2"]{background-color:#6b4226;background-image:var(--bg2)}
#app[data-ch="3"]{background-color:#9aa6a2;background-image:var(--bg3)}
#app[data-ch] .floor{display:none}
.chart{width:100%;aspect-ratio:200/90;border-radius:10px;margin:4px 0;background-size:cover;background-position:center 16%;box-shadow:inset 0 0 0 2px rgba(58,42,28,.25)}
.chart.c1{background-image:var(--bg1)}.chart.c2{background-image:var(--bg2)}.chart.c3{background-image:var(--bg3)}
img.ti{display:block;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
.tool img.ti{width:36px;height:36px;filter:drop-shadow(0 1px 0 rgba(58,42,28,.25))}
.tray.two .tool img.ti{width:28px;height:28px}
.bi img.ti{width:17px;height:17px;display:inline-block}
.unlockcard img.ti{width:46px;height:46px;flex:none;background:var(--paper);border-radius:8px;padding:3px}
.dg img.ti{width:24px;height:24px}
.overlay.title{background:var(--deep);padding:0}
.overlay.title .panel{max-width:480px;height:100%;max-height:none;border-radius:0;justify-content:space-between;gap:10px;box-shadow:none;
  background:#f1d3a4 var(--titleart) center 42%/cover no-repeat;
  padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(18px + env(safe-area-inset-bottom,0px))}
.tlogo{width:min(94%,400px);aspect-ratio:720/182;margin:0 auto;background:var(--logo) center/contain no-repeat;display:flex;align-items:center;justify-content:center;
  filter:drop-shadow(0 8px 10px rgba(90,46,14,.28));animation:tlogo 3.2s ease-in-out infinite}
.tlogo b{font-family:var(--display);font-weight:400;font-size:clamp(34px,10.5vw,50px);line-height:1;letter-spacing:.16em;margin:-1% 0 0 .16em;color:#ffe9ad;
  text-shadow:0 3px 0 #6b1a12,0 0 14px rgba(255,214,140,.55)}
.tsub{align-self:center;margin-top:-4px;padding:3px 14px;border-radius:999px;background:rgba(255,248,232,.82);color:#7a4a22;font-size:13px;letter-spacing:.28em}
.ttop{display:flex;flex-direction:column;gap:8px}
.tbot{display:flex;flex-direction:column;gap:8px}
.tbot .btn{font-size:21px;padding:13px 14px;box-shadow:0 4px 0 #7d1d18,0 8px 18px rgba(90,46,14,.3)}
.tbot .btns{margin:0}
.tbot .tlinks{display:flex;gap:8px}
.tbot .tlinks .btn{font-size:15px;padding:8px 10px;background:rgba(255,248,232,.9);color:var(--ink);box-shadow:0 2px 0 rgba(90,46,14,.35);min-width:0}
.tnote{background:rgba(255,248,232,.92);border-radius:10px;padding:8px 12px;font-size:13px;line-height:1.5;color:var(--ink)}
@keyframes tlogo{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion: reduce){.tlogo{animation:none}}
</style>

</head>
<body>
<div id="app">
  <div class="floor" aria-hidden="true"></div>
  <div class="sky" id="sky" aria-hidden="true"><i class="grade"></i><i class="glow"></i><i class="dusk"></i></div>
  <header class="top">
    <div class="sign" id="signText">奶蛙足道</div>
    <div class="stats">
      <div class="chip" id="dayChip">第1天</div>
      <div class="chip coin" id="coinChip">¥0</div>
      <button class="icon-btn" id="menuBtn" aria-label="菜单">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h14"/></svg>

let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f1,f2,dur,type,vol,delay){const a=AC;if(!a||S.muted||a.state!=='running')return;const t=a.currentTime+(delay||0);const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.03);}
function noise(dur,vol,freq){const a=AC;if(!a||S.muted||a.state!=='running')return;const b=a.createBuffer(1,Math.floor(a.sampleRate*dur),a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;const g=a.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(a.destination);s.start();}

function webPath(c,g){
  c.beginPath();c.moveTo(BASES[0][0]-14-g,BASES[0][1]+14);c.lineTo(TIPS[0][0]-6-g,TIPS[0][1]+4);
  for(let i=0;i<4;i++){const a=TIPS[i],b=TIPS[i+1];const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;c.quadraticCurveTo(mx,my+(300-my)*.5-g*1.5,b[0],b[1]);}
  c.lineTo(TIPS[4][0]+6+g,TIPS[4][1]+4);c.lineTo(BASES[4][0]+14+g,BASES[4][1]+14);c.closePath();
}
function footShape(c,g,web){
  const base=c.fillStyle;
  if(web)c.fillStyle=web;webPath(c,g);c.fill();c.fillStyle=base;
  c.beginPath();c.ellipse(180,350,88+g,74+g,0,0,TAU);c.fill();
  c.beginPath();c.ellipse(180,420,68+g,54+g,0,0,TAU);c.fill();
  c.lineCap='round';c.lineWidth=28+2*g;c.strokeStyle=base;
  for(let i=0;i<5;i++){c.beginPath();c.moveTo(BASES[i][0],BASES[i][1]);c.lineTo(TIPS[i][0],TIPS[i][1]);c.stroke();}
  for(let i=0;i<5;i++){c.beginPath();c.arc(TIPS[i][0],TIPS[i][1],20+g,0,TAU);c.fill();}

function rgb2hsv(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360;}return[h,mx?d/mx:0,mx];}
function hsv2rgb(h,s,v){h=((h%360)+360)%360;const c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c;let r,g,b;if(h<60)[r,g,b]=[c,x,0];else if(h<120)[r,g,b]=[x,c,0];else if(h<180)[r,g,b]=[0,c,x];else if(h<240)[r,g,b]=[0,x,c];else if(h<300)[r,g,b]=[x,0,c];else[r,g,b]=[c,0,x];return[(r+m)*255,(g+m)*255,(b+m)*255];}

      const skin=foot?(h>=28&&h<=66&&s>.1&&v>.6):(h>=32&&h<=64&&s>.33&&v>.55);if(!skin)continue;

  c.beginPath();for(const [dx,dy,r] of [[-.5,.15,.55],[.45,.2,.5],[0,-.25,.62],[0,.3,.5]])c.moveTo(dx*s+r*s,dy*s),c.arc(dx*s,dy*s,r*s,0,TAU);c.stroke();
  c.fillStyle='rgba(255,255,255,.96)';for(const [dx,dy,r] of [[-.5,.15,.5],[.45,.2,.45],[0,-.25,.57],[0,.3,.45]]){c.beginPath();c.arc(dx*s,dy*s,r*s,0,TAU);c.fill();}
  c.fillStyle='rgba(255,170,200,.6)';circ(c,-s*.2,-s*.1,s*.09);circ(c,s*.25,s*.05,s*.07);
  c.fillStyle='#ffd27a';c.beginPath();for(let j=0;j<8;j++){const a=j*Math.PI/4,rr=j%2?s*.08:s*.22;c.lineTo(s*.55+Math.cos(a)*rr,-s*.45+Math.sin(a)*rr);}c.fill();
  c.restore();
}
function drawPeelGuides(c,t){
  for(const p of C.patches){const a=.35+.3*Math.sin(t*5+p.x);c.strokeStyle=`rgba(120,90,40,${a})`;c.lineWidth=2;c.lineCap='round';
    for(const dx of [-p.rx*.35,p.rx*.35]){const off=((t*14)%10);c.beginPath();c.moveTo(p.x+dx-5,p.y-6+off);c.lineTo(p.x+dx,p.y-1+off);c.lineTo(p.x+dx+5,p.y-6+off);c.stroke();}}
}

let speechT=null;
function say(t){const b=$('speech');if(!b)return;b.textContent=t;b.hidden=false;b.classList.remove('in','out');void b.offsetWidth;b.classList.add('in');
  clearTimeout(speechT);speechT=setTimeout(()=>{b.classList.add('out');speechT=setTimeout(()=>{b.hidden=true;},380);},3400);}
function setInstr(t){$('instr').textContent=t;}
function flashInstr(t){setInstr(t);const b=$('instrBox');b.classList.remove('flash');void b.offsetWidth;b.classList.add('flash');}
let progV=0;
function progress(v){progV=v==null?0:clamp(v,0,1);const w=$('progWrap');if(v==null){w.hidden=true;return;}w.hidden=false;$('prog').style.width=(clamp(v,0,1)*100)+'%';}
function setFace(f,t){if(f!==face){if(f==='ouch')R.jv=-260;if(f==='hot')R.jv=-160;if(f==='angry')R.sacT=.6;}if(f==='tickle')R.tick=1;face=f;faceT=t;}
const baseFace=()=>C&&C.pat<30?'angry':'neutral';
function hud(){$('dayChip').textContent=DBG.solo?`试玩 · ${STEPS[DBG.solo].n}`:`第${S.day}关 ★${totalStars()}`;tweenCoins();if(C&&C.boss)$('custCount').textContent=`Boss 战 · 满意度 ${Math.round(C.pat)}`;else if(C)$('custCount').textContent=`${Math.min(doneCount+1,dayCount())}/${dayCount()} 位 · ¥${dayEarn}`;}
let shownCoins=null,coinTw=null;
function coinText(v){return v>=10000?'¥'+(v/10000).toFixed(1)+'万':'¥'+v;}
function tweenCoins(){const el=$('coinChip');if(shownCoins==null){shownCoins=S.coins;el.textContent=coinText(S.coins);return;}
  if(shownCoins===S.coins){el.textContent=coinText(S.coins);return;}
  if(S.coins<shownCoins||matchMedia('(prefers-reduced-motion: reduce)').matches){shownCoins=S.coins;el.textContent=coinText(S.coins);return;}
  const from=shownCoins,to=S.coins,t0=performance.now(),dur=900;cancelAnimationFrame(coinTw);
  const step=now=>{const k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3);shownCoins=Math.round(from+(to-from)*e);el.textContent=coinText(shownCoins);if(k<1)coinTw=requestAnimationFrame(step);};coinTw=requestAnimationFrame(step);}
function flyCoins(n,fromEl){
  const tgt=$('coinChip').getBoundingClientRect(),src=(fromEl||$('stage')).getBoundingClientRect();
  const sx=src.left+src.width/2,sy=src.top+src.height*.45,tx=tgt.left+tgt.width/2,ty=tgt.top+tgt.height/2;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches||!document.body.animate){popCoin();return;}
  for(let i=0;i<n;i++){const d=document.createElement('i');d.className='flycoin';document.body.appendChild(d);
    const ang=Math.random()*TAU,r=30+Math.random()*40,mx=sx+Math.cos(ang)*r,my=sy+Math.sin(ang)*r-20;
    const a=d.animate([{transform:`translate(${sx}px,${sy}px) scale(.4)`,opacity:0},{transform:`translate(${mx}px,${my}px) scale(1.1)`,opacity:1,offset:.3},{transform:`translate(${tx}px,${ty}px) scale(.7)`,opacity:1}],
      {duration:700+i*60,delay:i*45,easing:'cubic-bezier(.5,0,.7,1)',fill:'forwards'});
    a.onfinish=()=>{d.remove();popCoin();if(i===0)tone(1319,1568,.06,'square',.03);};}
}
function popCoin(){const c=$('coinChip');c.classList.remove('pop');void c.offsetWidth;c.classList.add('pop');}
function renderTicket(){
  $('cName').innerHTML=C.name+'<small class="kind">'+C.look.n+'</small>';$('tagNo').textContent='手牌 '+String(C.tag).padStart(2,'0');
  $('patLbl').textContent=C.boss?'满意度':'耐心';$('patWrap').classList.toggle('boss',!!C.boss);
  const tg=(assistLv&&!DBG.solo?'<span class="tg assist">店长帮忙中</span>':'')+(C.boss?`<span class="tg boss">BOSS${bossRun&&BM_TAG[bossRun.id]?' · '+BM_TAG[bossRun.id]:''} · 满意度 60/75/90 = 1/2/3 星</span>`:C.vip?`<span class="tg vip">贵客 · ${C.vip.rule}</span>`:'')+(C.demand?`<span class="tg dem">要求：${C.demand.id==='speed'?'这一项 15 秒内做完':'这一项不许出错'}</span>`:'')+C.traits.map(k=>`<button class="tg" data-k="${k}">${TRAITS[k].n}</button>`).join('')+(C.herb?`<span class="tg herb">泡脚加${C.herb.n}</span>`:'');
  $('tags').innerHTML=tg;$('tags').hidden=!tg;
  $('chips').innerHTML=C.steps.map((s,i)=>{
    const cls=C.q[s]!=null?'done':(i===C.si?'cur':'');
    const extra=s==='paint'?dotsHtml(C.paint):s==='art'&&C.art?`·${C.art.n}`:'';
    return `<span class="st ${cls} ${s===C.added&&C.q[s]==null?'new':''}">${STEPS[s].n.replace('足底','').replace('蛙趾','').replace('足部','')}${extra}</span>`;
  }).join('')+`<span class="st ${C.si>=C.steps.length?'cur':''}">结账</span>`;
  hud();
}

const TOOLS=[['soak','木桶'],['scrub','搓澡巾'],['trim','指甲钳'],['peel','刮刀'],['massage','推拿'],['paint','甲油'],['mask','泥膜'],['fish','鱼缸'],['wax','蜡条'],['moxa','火罐'],['art','画笔'],['towel','毛巾']];
$('tray').innerHTML=TOOLS.map(([id,n])=>`<button class="tool" id="tool-${id}" data-id="${id}" aria-label="${n}">${ti(id)}<small>${n}</small></button>`).join('');
$('tray').addEventListener('click',e=>{const b=e.target.closest('.tool');if(b)useTool(b.dataset.id,b);});
function updateTray(){let n=0;document.querySelectorAll('.tool').forEach(b=>{const id=b.dataset.id,lock=id!=='towel'&&UNLOCK[id]>S.day;b.hidden=lock;if(!lock)n++;b.classList.toggle('active',!!M&&M.type===id);b.classList.remove('hint');});const tr=$('tray');tr.style.setProperty('--cols',n<=7?n:Math.ceil(n/2));tr.classList.toggle('two',n>7);}
function hintTool(id){const b=$('tool-'+id);if(b)b.classList.add('hint');}

function useTool(id,btn){
  ac();
  if(paused||!C||C.done||entry<1)return;
  if(TUT.on){if(!TUT.expect)return;if(id!==TUT.expect){flashInstr('先点亮起来的那个');sfx.bad();return;}}
  if(id!=='towel'&&UNLOCK[id]>S.day){flashInstr(`「${STEPS[id].n}」第 ${UNLOCK[id]} 天解锁`);return;}
  if(M){flashInstr('先把手上这一步做完');return;}
  if(C.boss&&bmBlock(id))return;
  if(id==='towel'){
    if(C.boss&&C.si<C.steps.length){flashInstr('Boss 的项目还没做完，不能结账');sfx.bad();return;}
    if(C.si<C.steps.length&&!towelArm){towelArm=true;flashInstr('还有项目没做，再点一次毛巾直接结账');setTimeout(()=>towelArm=false,2600);return;}
    towelArm=false;checkout(false);return;
  }
  if(C.si>=C.steps.length){say('都弄完啦，擦干结账吧～');hintTool('towel');return;}
  const need=C.steps[C.si];
  if(id===need){startMini(id);return;}
  C.pat-=8;wrongCount++;setFace('angry',1.2);shake=.3;sfx.bad();
  say(!C.steps.includes(id)?`我没点${STEPS[id].n}啊！`:pick(LINES.wrong));
  if(btn){btn.classList.remove('no');void btn.offsetWidth;btn.classList.add('no');}
  if(wrongCount>=2){flashInstr(`提示：下一步是「${STEPS[need].n}」`);hintTool(need);}else flashInstr('工具不对，客人不高兴了');
}

function startMini(t){
  sfx.tap();R.fly=null;const K=cfg(S.day),now=performance.now();
  if(SVC[t]){M=Object.assign({type:t,t0:now},SVC[t].start());setInstr(SVC[t].how);progress(0);updateTray();tutEv('mini',t);firstHint(t);return;}
  if(t==='soak'){
    M={type:'soak',T:31,prog:0,need:K.soakNeed,over:0,hotT:0,saidB:false,saidC:false,herb:null,herbWrong:0,tint:null,gustT:3+Math.random()*3,capHint:false,t0:now};
    const z=soakZone();
    if(C.herb){renderHerbs();$('swatches').hidden=false;}
    setInstr(`按住画面加热水，保持在 ${Math.round(z[0])}–${Math.round(z[1])}°`+(C.herb?`，再放一把${C.herb.n}`:''));
  }
  if(t==='scrub'){
    M={type:'scrub',clean:0,mt:0,dirty:true,tk:0,lastT:0,kicks:0,t0:now};
    let s='在脚底来回搓，把黑泥搓干净';if(C.lumps.length)s+='；硬泥块要多搓几下';if(C.tickles.length)s+='；粉色痒痒肉要慢慢搓';setInstr(s);
  }
  if(t==='peel'){M={type:'peel',clean:0,mt:0,dirty:false,bad:0,curls:0,curl:{x:0,y:0,s:0},badStroke:false,lastT:0,t0:now};setInstr('顺着箭头往下刮，一块刮得差不多就会整块掉下来；一直往上推会疼');}
  if(t==='trim'){
    M={type:'trim',miss:0,filing:false,t0:now};
    let s='点长指甲把它剪掉，别夹到肉';if(C.nails.some(n=>n.thick))s+='；厚指甲要剪几下';if(C.callus)s+='；脚跟老茧按住来回锉';setInstr(s);
  }
  if(t==='massage'){
    const pts=[];for(let i=0;i<K.mNotes;i++){let p;do{p=pick(POINTS);}while(pts.length&&p===pts[pts.length-1]);pts.push(p);}
    if(C.has('insomnia')){const ins=POINTS.find(p=>p.n==='失眠点');pts.splice(2,0,ins);pts.push(ins);}
    const seq=pts.map(p=>({p,type:K.rapid&&Math.random()<.2?'rapid':K.hold&&Math.random()<.28?'hold':'tap'}));
    M={type:'massage',seq,k:0,r:56,wait:.6,score:0,spd:44*K.mSpeed*(1-.08*toolLv('massage')),holding:false,hfill:0,hq:0,taps:0,rt:1.8,t0:now};
    let s='光圈缩到金圈上时点穴位';if(K.hold)s+='；「长按」要按住到满';if(K.rapid)s+='；「连点」快速点 5 下';setInstr(s);
  }
  if(t==='paint'){M={type:'paint',color:null,wrong:0,t0:now};renderSwatches();$('swatches').hidden=false;setInstr(`照右上角卡片涂：${C.paint.label}。先选颜色，再点脚趾`);}
  progress(0);updateTray();
  tutEv('mini',t);firstHint(t);
}
function finish(step,q){
  hintOff();tutEv('finish',step);
  C.q[step]=q;C.si++;
  const el=(performance.now()-M.t0)/1000;
  M=null;hold=false;scrubbing=false;$('swatches').hidden=true;
  if(step==='scrub')fadeDirt=1;
  if(step==='peel')peelFade=1;
  sfx.ding();setFace('happy',1.6);R.jv=-170;
  addFT(q>=.9?'完美！':q>=.7?'不错':'凑合',180,250,q>=.9?'#f5c95c':'#ffffff',26,1);
  if(C.has('rush')&&el<10){C.fast+=6;addFT('快手奖 +¥6',180,280,'#f5c95c',18,1);}
  renderTicket();updateTray();progress(null);
  if(C.si<C.steps.length)setInstr('这步完成！选下一件工具');else{setInstr('全部做完，用毛巾擦干结账');hintTool('towel');}
  bossAfterFinish(step,q);
  if(!C.evented&&!C.vip&&!DBG.solo&&!TUT.on&&Math.random()<cfg(S.day).eventP){C.evented=true;const cc=C;setTimeout(()=>{if(C===cc)serviceEvent();},1100);}
}
function serviceEvent(){
  if(!C||C.done||M||paused)return;
  const U=cfg(S.day).unlock,lastIdx=ORDER.indexOf(C.steps[C.si-1]);
  const remaining=C.steps.slice(C.si);
  const addable=U.filter(s=>!C.steps.includes(s)&&ORDER.indexOf(s)>lastIdx&&s!=='soak'&&s!=='scrub');
  const opts=[];if(addable.length)opts.push('add','add');if(remaining.includes('paint'))opts.push('repaint');if(remaining.some(s=>s!=='paint'))opts.push('drop');
  if(!opts.length)return;
  const o=pick(opts);
  if(o==='add'){const s=pick(addable);
    if(s==='trim'){C.nails=genNails(S.day,true);}

/* ---------- checkout / level flow ---------- */
function checkout(angry){
  if(!C||C.done)return;
  tutEv('checkout');hintOff();
  C.done=true;M=null;Q=null;hold=false;scrubbing=false;peeling=false;$('swatches').hidden=true;closeChat();updateTray();
  if(C.boss){bossEnd(!angry);return;}
  const k=C.has('picky')?1.3:1;
  const rows=C.steps.map(s=>({s,q:C.q[s],amt:C.q[s]!=null?Math.round(STEPS[s].p*C.q[s]*k*(1+.1*toolLv(s))):0}));
  let sum=rows.reduce((a,r)=>a+r.amt,0);
  const undone=rows.filter(r=>r.q==null).length;
  const avg=rows.reduce((a,r)=>a+(r.q||0),0)/rows.length;
  let stars=angry?1:clamp(Math.round(avg*3.2+C.pat/100*1.8),1,5);
  if(!angry&&C.has('picky')&&rows.some(r=>r.q!=null&&r.q<.85))stars=Math.max(1,stars-1);
  let tip=0,cut=0;
  if(angry){cut=sum-Math.round(sum*.5);sum-=cut;}
  else if(!undone)tip=Math.round(sum*.3*(C.pat/100)*(1+decoEff('tip'))*(stars>=4?1:.5)*(C.has('rich')?2:1));
  const extras=angry?[]:[['快手奖',C.fast],['聊天小费',C.chatTip],['应变奖',C.qteTip]].filter(x=>x[1]>0);
  let vipB=0;if(!angry&&C.vip){const v=C.vip,ok=v.strict?rows.every(r=>r.q!=null&&r.q>=.9):stars>=4&&!undone;vipB=ok?Math.round(sum*(v.mult-1)*.4):0;if(vipB){extras.push(['贵客打赏',vipB]);setTimeout(()=>{tone(1319,1319,.1,'square',.05);tone(1568,1568,.2,'square',.05,.1);},300);}}
  const total=sum+tip+extras.reduce((a,x)=>a+x[1],0);
  S.coins+=total;dayEarn+=total;dayStars.push(stars);S.served++;save();if(total>0)flyCoins(Math.min(9,2+Math.ceil(total/25)));setTimeout(hud,450);
  if(total>0)setTimeout(()=>sfx.coin(),150);
  if(!angry){setFace(undone?'angry':'bliss',99);}
  const line=angry?'不洗了！再也不来了！':C.vip?(vipB?C.vip.done:C.vip.bad):undone?'怎么没弄完就让我走？':pick(LINES.done);
  setTimeout(()=>showReceipt(rows,tip,cut,total,stars,line,angry,extras),angry?500:350);
}

  const g=starGoals(dayGoal),got=g.filter(x=>dayEarn>=x).length;
  open(`<h2>${C.name} 的账单</h2>
  <div class="stars" aria-label="${stars} 星">${'★'.repeat(stars)}${'☆'.repeat(5-stars)}</div>
  <div class="say">「${line}」</div>

function layerCanvas(){const c=document.createElement('canvas');c.width=W*DS;c.height=H*DS;return c;}
const MSK=layerCanvas(),msc=MSK.getContext('2d'),ARTC=layerCanvas(),arc=ARTC.getContext('2d');

function clearLayer(x){x.setTransform(1,0,0,1,0,0);x.globalCompositeOperation='source-over';x.clearRect(0,0,W*DS,H*DS);}
function lbl(c,txt,x,y,col,size){c.font=`${size||13}px ${DISPLAY}`;c.textAlign='center';c.lineWidth=3;c.lineJoin='round';c.strokeStyle='rgba(30,20,10,.82)';c.strokeText(txt,x,y);c.fillStyle=col||'#fff';c.fillText(txt,x,y);}

SVC.mask={
  how:'按住在脚底抹匀绿泥膜，把整只脚盖满',
  init(on){clearLayer(msc);},
  start(){clearLayer(msc);return{phase:'smear',cov:0,mt:0,dirty:false,dry:0,need:2.2-.4*toolLv('mask'),pokes:0,pull:0,pulling:false,sy:0,smearing:false,rip:0,tab:{x:158,y:349}};},
  dab(x0,y0,x1,y1){msc.setTransform(DS,0,0,DS,0,0);msc.globalCompositeOperation='source-over';msc.lineCap='round';msc.strokeStyle='#7fae5a';msc.lineWidth=26+5*toolLv('mask');msc.beginPath();msc.moveTo(x0,y0);msc.lineTo(x1,y1);msc.stroke();
    msc.fillStyle='rgba(165,205,120,.7)';for(let i=0;i<2;i++){msc.beginPath();msc.arc(x1+(Math.random()-.5)*20,y1+(Math.random()-.5)*20,2+Math.random()*4,0,TAU);msc.fill();}
    clipFoot(msc);M.dirty=true;},
  down(x,y){
    if(M.phase==='smear'){M.smearing=true;this.dab(x,y,x,y);}
    else if(M.phase==='dry'){if(onFoot(x,y)){M.pokes++;C.pat-=3;setFace('angry',.8);say('还没干呢，别乱戳！');sfx.bad();addFT('还没干',x,y-12,'#ff8a80',15);}}
    else if(M.phase==='peel'){if(Math.hypot(x-M.tab.x,y-M.tab.y)<32){M.pulling=true;M.sy=y;tone(300,200,.05,'sine',.05);}else flashInstr('按住脚跟下面的小角往上撕');}
  },
  move(p,lp){
    if(M.phase==='smear'&&M.smearing){this.dab(lp[0],lp[1],p[0],p[1]);if(Math.random()<.3)PS.push({k:'drop',x:p[0],y:p[1],vx:(Math.random()-.5)*40,vy:-30,life:.5,max:.5,r:2.5,c:'#7fae5a'});if(bubT<=0){tone(180+Math.random()*60,120,.05,'sine',.04);bubT=.12;}if(Math.random()<.04)setFace('bliss',.6);}
    else if(M.phase==='peel'&&M.pulling){M.pull=Math.max(0,M.sy-p[1]);if(M.pull>90)this.rip();}
  },
  up(){M.smearing=false;M.pulling=false;},
  rip(){M.phase='ripped';M.pulling=false;M.rip=0;noise(.25,.35,900);tone(700,200,.2,'triangle',.08,.05);setFace('ouch',.5);shake=.2;
    setTimeout(()=>{if(C&&!C.done){setFace('bliss',1.4);say(pick(['啪！好爽！','脚底像剥了壳的鸡蛋！','舒服，滑溜溜的。']));}},450);
    for(let i=0;i<14;i++)PS.push({k:'drop',x:100+Math.random()*120,y:180+Math.random()*160,vx:(Math.random()-.5)*120,vy:-120-Math.random()*80,life:.9,max:.9,r:2+Math.random()*3,c:'#9cc27a'});},
  update(dt){
    if(M.phase==='smear'){M.mt-=dt;if(M.dirty&&M.mt<=0){M.mt=.15;M.dirty=false;M.cov=countCanvas(MSK)/FOOTPX;progress(M.cov/.88);if(M.cov>=.88){M.phase='dry';M.smearing=false;setInstr('泥膜正在变干，别碰它，等它裂开');say('凉凉的，好舒服～');}}}
    else if(M.phase==='dry'){M.dry+=dt;progress(M.dry/M.need);setFace('bliss',.2);
      msc.setTransform(1,0,0,1,0,0);msc.globalCompositeOperation='source-atop';msc.fillStyle=`rgba(214,222,170,${dt*.9})`;msc.fillRect(0,0,MSK.width,MSK.height);
      if(Math.random()<dt*7){msc.setTransform(DS,0,0,DS,0,0);msc.strokeStyle='rgba(110,120,70,.6)';msc.lineWidth=1;let x=90+Math.random()*130,y=160+Math.random()*180;msc.beginPath();msc.moveTo(x,y);for(let k=0;k<4;k++){x+=(Math.random()-.5)*14;y+=(Math.random()-.5)*14;msc.lineTo(x,y);}msc.stroke();}

      if(M.dry>=M.need){M.phase='peel';setInstr('干了！按住脚跟下面的小角，往上一把撕下来');sfx.ding();progress(1);}}
    else if(M.phase==='peel'){if(!M.pulling)M.pull=Math.max(0,M.pull-dt*300);}

  },
  layer(c){

    if(M.phase==='ripped'){off=-40-M.rip*260;rot=-.15-M.rip*.5;a=1-M.rip;}
    c.save();c.globalAlpha=Math.max(0,a);c.translate(158,350);c.rotate(rot);c.translate(-158,-350+off);c.drawImage(MSK,0,0,W,H);c.restore();
  },
  draw(c,t){
    if(M.phase!=='peel')return;

    c.fillStyle='#c9d99a';c.strokeStyle='#5c7a32';c.lineWidth=1.5;c.beginPath();c.moveTo(tb.x-15,tb.y-8+oy);c.lineTo(tb.x+15,tb.y-8+oy);c.lineTo(tb.x+9,tb.y+9+oy);c.lineTo(tb.x-9,tb.y+9+oy);c.closePath();c.fill();c.stroke();

      c.fillStyle='#fff';c.beginPath();c.moveTo(tb.x,tb.y-38-pul*6);c.lineTo(tb.x-8,tb.y-26-pul*6);c.lineTo(tb.x+8,tb.y-26-pul*6);c.closePath();c.fill();lbl(c,'往上撕',tb.x+44,tb.y-4,'#ffe9a0',13);}
  }
};

/* 鱼疗：小鱼啄泡泡，赶走大鱼 */
function drawFish(c,x,y,a,ph,s,col,big){
  c.save();c.translate(x,y);c.rotate(a);if(Math.cos(a)<0)c.scale(1,-1);
  const tw=Math.sin(ph)*.35;
  c.fillStyle=col;c.strokeStyle=big?'#6a2a0a':'rgba(40,60,70,.8)';c.lineWidth=big?1.8:1.2;
  c.save();c.translate(-s*.9,0);c.rotate(tw);c.beginPath();c.moveTo(0,0);c.lineTo(-s*.8,-s*.55);c.lineTo(-s*.8,s*.55);c.closePath();c.fill();c.stroke();c.restore();
  c.beginPath();c.ellipse(0,0,s,s*.58,0,0,TAU);c.fill();c.stroke();
  c.fillStyle='#1e1a16';circ(c,s*.5,-s*.12,big?2.6:1.5);
  if(big){c.strokeStyle='#6a2a0a';c.lineWidth=1.6;c.beginPath();c.arc(s*.7,s*.2,s*.12,0,Math.PI);c.stroke();c.fillStyle='rgba(255,140,120,.5)';circ(c,s*.35,s*.15,s*.12);
    c.strokeStyle='#6a2a0a';c.lineWidth=2;c.beginPath();c.moveTo(s*.25,-s*.44);c.lineTo(s*.62,-s*.3);c.stroke();}
  c.restore();
}
SVC.fish={
  how:'小鱼会自己把脚啄干净，点小泡泡能把鱼引过去；调皮的大鱼来了快点它赶走',

  down(x,y){const b=M.big;if(b&&b.state!=='leave'&&Math.hypot(x-b.x,y-b.y)<30){b.state='leave';b.vx=(b.x<158?-1:1)*260;M.shoo++;addFT('赶走了！',b.x,b.y-18,'#f5c95c',15);sfx.perfect();for(let i=0;i<8;i++)PS.push({k:'drop',x:b.x,y:b.y,vx:(Math.random()-.5)*140,vy:-80-Math.random()*60,life:.6,max:.6,r:2+Math.random()*2,c:'#bfe6f5'});return;}

        else{f.vx*=.8;f.vy*=.8;tgt.a-=dt*1.6;if(tgt.a<=0){M.eaten++;PS.push({k:'spark',x:tgt.x,y:tgt.y,vx:0,vy:-30,life:.4,max:.4,r:3,c:'#fff8d8'});if(bubT<=0){tone(700,1100,.04,'sine',.035);bubT=.08;}if(Math.random()<.15)setFace(Math.random()<.5?'tickle':'bliss',.6);}}}
      else{f.vx*=.95;f.vy*=.95;}

    else{const b=M.big;b.ph+=dt*10;

      else if(b.state==='bite'){b.t+=dt;if(b.t>.5){M.bites++;C.pat-=8;setFace('ouch',1);shake=.4;sfx.bad();say(pick(['哎哟！这条大鱼啄得好用力！','大鱼太调皮啦！']));addFT('啄疼了',b.x,b.y-18,'#ff8a80',15);b.state='leave';b.vx=(b.x<158?-1:1)*200;}}

/* ---------- boss mechanics: 挑刺 / 宫廷规矩 / 同行比拼 ---------- */
const BM_TAG={gourmet:'挑刺',prince:'宫廷规矩',onsen:'同行比拼'};
const RIVAL_PAR={soak:9,scrub:11,peel:10,trim:9,massage:13,paint:10,mask:12,fish:15,wax:14,moxa:14,art:13};
const RIVAL_GAP=2.5,BOWY=250,FORCE_LIM=1300;
function bmNew(id){
  if(id==='gourmet')return{k:'pick',phase:null,t:0,max:4,flaws:[],found:0,total:0,clean:0,rounds:0};
  if(id==='prince')return{k:'court',bow:null,bowedFor:-1,bows:0,bowOk:0,force:0,warned:false,rude:0,cool:0,lastT:0};
  if(id==='onsen')return{k:'race',rt:0,hers:0,lead:0,behind:0,end:null};
  return{k:''};
}
const BMm=()=>bossRun&&bossRun.m||null;
function bmSat(d,txt,x,y){C.pat=clamp(C.pat+d,0,100);addFT(`${txt} ${d>0?'+':d<0?'−':''}${d?Math.abs(d):''}`.trim(),x||180,y||300,d>0?'#b8f5c0':d<0?'#ff8a80':'#ffffff',16,1);renderTicket();}
function bmBegin(){const m=BMm();if(!m)return;const cc=C;
  if(m.k==='race')setTimeout(()=>{if(C===cc&&!C.done){say('阿汤，开始！让他们看看温泉山庄的手艺。');addFT('比拼开始！',180,110,'#ffd58a',22,1);sfx.croak();}},900);
}
function bmBusy(){const m=BMm();return !!m&&((m.k==='pick'&&!!m.phase)||(m.k==='court'&&!!m.bow));}
function bmAfterFinish(step,q){
  const m=BMm();if(!m)return;const cc=C;
  if(m.k==='pick'){m.phase='wait';setTimeout(()=>{if(C===cc&&!C.done&&m.phase==='wait')bmPick(q);},450);}
  if(m.k==='race'){
    const hers=rivalDone(m);
    if(C.si>hers){m.lead++;bmSat(3,'领先阿汤',180,330);}
    else if(C.si<hers){m.behind++;bmSat(-2,'落后阿汤',180,330);}
    else addFT('和阿汤打平',180,330,'#ffffff',16,1);
    if(C.si>=C.steps.length&&!m.end){m.end='win';bmSat(6,'比阿汤先做完！',180,360);setTimeout(()=>{if(C===cc)say('……这速度，可以啊。');},700);}
  }
}
function bmBlock(id){
  const m=BMm();if(!m)return false;
  if(m.k==='pick'&&m.phase){flashInstr(m.phase==='fix'?'呱德在挑刺，先把放大镜圈出来的地方点掉':'呱德正在检查，等一下');sfx.bad();return true;}
  if(m.k==='court'&&!m.bow&&id!=='towel'&&id===C.steps[C.si]&&m.bowedFor!==C.si){bmBow(id);return true;}
  if(m.k==='court'&&m.bow){if(!m.bow.pen){m.bow.pen=true;C.pat-=4;setFace('angry',1);say('放肆！还没行礼！');addFT('失礼 −4',180,300,'#ff8a80',16,1);renderTicket();}flashInstr('宫廷规矩：先长按中间的按钮行礼');sfx.bad();return true;}
  return false;
}
function bmDown(fx,fy,sx,sy){
  const m=BMm();if(!m)return false;
  if(m.k==='pick'&&m.phase){
    if(m.phase!=='fix')return true;
    const f=m.flaws.find(f=>!f.ok&&Math.hypot(fx-f.x,fy-f.y)<f.r+16);
    if(f){f.ok=true;m.found++;C.pat=Math.min(100,C.pat+1);sfx.perfect();addFT('补好了',f.x+FO.x,f.y+FO.y-20,'#f5c95c',15);
      for(let i=0;i<7;i++)PS.push({k:'spark',x:f.x,y:f.y,vx:(Math.random()-.5)*120,vy:-50-Math.random()*60,life:.6,max:.6,r:3,c:pick(['#ffffff','#ffe9a8','#d8ccff'])});
      if(m.flaws.every(f=>f.ok))bmPickEnd();}
    else sfx.tap();
    return true;}
  if(m.k==='court'&&m.bow){if(Math.hypot(sx-180,sy-BOWY)<54){m.bow.holding=true;sfx.tap();}return true;}
  return false;
}
function bmUp(){const m=BMm();if(m&&m.k==='court'&&m.bow)m.bow.holding=false;}
function bmMove(d,ts){
  const m=BMm();if(!m||m.k!=='court'||!M)return;
  const dtm=(ts-m.lastT)/1000;m.lastT=ts;if(dtm<=0||dtm>.2||m.cool>0)return;
  const spd=d/dtm;if(spd<=FORCE_LIM)return;
  m.force+=(spd-FORCE_LIM)/FORCE_LIM*dtm*1.4;
  if(m.force>=.7&&!m.warned){m.warned=true;addFT('轻一点……',180,90,'#ffd58a',18,1);say('嗯？轻一点。');}

    c.beginPath();c.moveTo(0,-w);c.lineTo(L-w,-w+b*.4);c.quadraticCurveTo(L+w*.6,b*.5,L-w,w+b*.4);c.lineTo(0,w);c.closePath();c.fill();c.stroke();
    c.strokeStyle='rgba(255,255,255,.85)';c.lineWidth=1.6;c.lineCap='round';c.beginPath();c.moveTo(3,-w*.45);c.lineTo(L-w-2,-w*.45+b*.3);c.stroke();
    if(n.thick){c.strokeStyle='rgba(150,115,70,.55)';c.lineWidth=1.2;for(let k=1;k<=3;k++){c.beginPath();c.moveTo(L*k/4.2,-w*.75);c.lineTo(L*k/4.2+1,w*.7);c.stroke();}c.strokeStyle='rgba(255,255,255,.95)';for(let k=0;k<3-n.hp;k++){c.beginPath();c.moveTo(L*.35+k*5,-w*.6);c.lineTo(L*.45+k*5,0);c.lineTo(L*.38+k*5,w*.5);c.stroke();}}
    if(M&&M.type==='trim'){c.strokeStyle=`rgba(245,201,92,${.5+.5*Math.sin(t*6)})`;c.lineWidth=2;c.setLineDash([4,4]);c.beginPath();c.arc(8+L*.6,n.bend*L*.25,12,0,TAU);c.stroke();c.setLineDash([]);}
  }else if(n.clipped&&!n.paint){c.fillStyle=dirty?'#8c6a48':'#efe2c2';c.strokeStyle='#6b4a2a';c.lineWidth=1.3;c.beginPath();c.ellipse(1,0,3.5,6.5,0,0,TAU);c.fill();c.stroke();}
  c.restore();
}
function drawBucketBack(c,k){const top=BT0-BTR*ease(k);c.strokeStyle='#6f4220';c.lineWidth=7;c.beginPath();c.ellipse(BX,top,BW+6,15,0,Math.PI,TAU);c.stroke();}
function drawBucketFront(c,k,t){
  const top=BT0-BTR*ease(k);const T=M&&M.type==='soak'?M.T:35;
  const hot=clamp((T-30)/25,0,1);
  c.fillStyle=`rgba(${120+hot*110},${200-hot*60},${225-hot*120},.6)`;
  c.beginPath();c.ellipse(BX,top+2,BW,13,0,Math.PI,TAU);
  for(let x=BX+BW;x>=BX-BW;x-=8)c.lineTo(x,top+2+Math.sin(x*.08+t*4)*2);c.closePath();c.fill();if(M&&M.tint){c.fillStyle=M.tint;c.globalAlpha=.4;c.fill();c.globalAlpha=1;}
  c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=1.5;c.beginPath();for(let x=BX-BW+8;x<=BX+BW-8;x+=6)c.lineTo(x,top-2+Math.sin(x*.07+t*3)*1.6);c.stroke();
  const g=c.createLinearGradient(BX-BW,0,BX+BW,0);g.addColorStop(0,'#8a5228');g.addColorStop(.5,'#c88a4c');g.addColorStop(1,'#7a461f');
  c.fillStyle=g;c.strokeStyle='#4d2c12';c.lineWidth=2.5;c.beginPath();c.moveTo(BX-BW-6,top);c.ellipse(BX,top,BW+6,15,0,Math.PI,0,true);c.lineTo(BX+BW-10,top+170);c.lineTo(BX-BW+10,top+170);c.closePath();c.fill();c.stroke();
  c.strokeStyle='rgba(60,30,10,.35)';c.lineWidth=1.5;
  for(let i=1;i<8;i++){const x0=BX-BW-6+i*(2*BW+12)/8,x1=BX-BW+10+i*(2*BW-20)/8;c.beginPath();c.moveTo(x0,top+14);c.lineTo(x1,top+170);c.stroke();}
  c.fillStyle='#4a4f55';[30,86].forEach(o=>{c.fillRect(BX-BW-4+o*.1,top+o,2*BW+8-o*.2,6);});
  c.strokeStyle='#6f4220';c.lineWidth=7;c.beginPath();c.ellipse(BX,top,BW+6,15,0,0,Math.PI);c.stroke();
}
function drawThermo(c){
  const x=336,y0=160,y1=340,[lo,hi]=soakZone();
  const ty=T=>y1-(T-22)/36*(y1-y0);
  c.fillStyle='rgba(255,255,255,.92)';c.strokeStyle='#2b2118';c.lineWidth=2;
  c.beginPath();c.roundRect(x-9,y0-8,18,y1-y0+16,9);c.fill();c.stroke();
  c.fillStyle='rgba(63,157,74,.45)';c.fillRect(x-7,ty(hi),14,ty(lo)-ty(hi));
  const T=M.T,col=T>hi+2?'#c4302a':T<lo-4?'#4b6fd6':'#e0612a';
  c.fillStyle=col;c.fillRect(x-4,ty(T),8,y1+8-ty(T));circ(c,x,y1+16,12);c.stroke();
  c.font=`14px ${DISPLAY}`;c.textAlign='center';c.lineWidth=3;c.strokeStyle='rgba(20,40,36,.85)';
  const s=Math.round(T)+'°';c.strokeText(s,x,y0-16);c.fillStyle='#fff';c.fillText(s,x,y0-16);
}
function drawMassage(c,t){
  if(M.k>=M.seq.length)return;
  const nt=M.seq[M.k],p=nt.p,nx=M.seq[M.k+1];
  if(nx){c.fillStyle='rgba(255,255,255,.4)';circ(c,nx.p.x,nx.p.y,4);}
  if(M.wait>0)return;
  c.font=`14px ${DISPLAY}`;c.textAlign='center';
  const label=(txt,y,col)=>{c.lineWidth=3;c.strokeStyle='rgba(30,20,10,.8)';c.strokeText(txt,p.x,y);c.fillStyle=col||'#fff';c.fillText(txt,p.x,y);};
  c.fillStyle='rgba(196,48,42,.85)';circ(c,p.x,p.y,6);
  if(nt.type==='rapid'){const pul=1+.15*Math.sin(t*20);
    c.strokeStyle='#ff9a6b';c.lineWidth=4;c.beginPath();c.arc(p.x,p.y,18*pul,0,TAU);c.stroke();
    c.strokeStyle='#f5c95c';c.lineWidth=3;c.beginPath();c.arc(p.x,p.y,26,-Math.PI/2,-Math.PI/2+TAU*clamp(M.rt/1.8,0,1));c.stroke();
    label(`连点 ${M.taps}/5`,p.y-34,'#ffd27a');label(p.n,p.y+44);return;}
  c.strokeStyle='#f5c95c';c.lineWidth=3;c.beginPath();c.arc(p.x,p.y,16,0,TAU);c.stroke();
  if(nt.type==='hold'){
    if(M.holding){c.strokeStyle='#ff9a6b';c.lineWidth=6;c.beginPath();c.arc(p.x,p.y,22,-Math.PI/2,-Math.PI/2+TAU*M.hfill);c.stroke();label('按住别松…',p.y-34,'#ffd27a');}
    else{c.strokeStyle='#ff9a6b';c.lineWidth=6;c.beginPath();c.arc(p.x,p.y,Math.max(1,M.r),0,TAU);c.stroke();label('长按 · '+p.n,p.y-M.r-8,'#ffd27a');}
    return;}
  c.strokeStyle='rgba(255,255,255,.95)';c.lineWidth=3.5;c.beginPath();c.arc(p.x,p.y,Math.max(1,M.r),0,TAU);c.stroke();
  label(p.n,p.y-M.r-8);
}
function drawPaintHints(c,t){
  TIPS.forEach((tp,i)=>{const tg=C.paint.t[i],n=C.nails[i],ok=tg?n.paint===tg.c:!n.paint;if(ok)return;
    c.strokeStyle=!tg?`rgba(255,120,110,${.6+.4*Math.sin(t*8)})`:`rgba(255,255,255,${.5+.4*Math.sin(t*5+i)})`;c.lineWidth=2;c.setLineDash([5,4]);c.beginPath();c.arc(tp[0],tp[1],22,0,TAU);c.stroke();c.setLineDash([]);
    if(tg){c.fillStyle=tg.c;circ(c,tp[0]+17,tp[1]-17,5);c.strokeStyle='#fff';c.lineWidth=1.5;c.beginPath();c.arc(tp[0]+17,tp[1]-17,5,0,TAU);c.stroke();}});
}
function drawParticles(c,scr){
  for(const p of PS){if(!!p.s!==scr)continue;const a=clamp(p.life/p.max,0,1);
    if(p.k==='foam'){c.fillStyle=`rgba(255,255,255,${.85*a})`;circ(c,p.x,p.y,p.r);c.strokeStyle=`rgba(150,200,220,${.6*a})`;c.lineWidth=1;c.beginPath();c.arc(p.x,p.y,p.r,0,TAU);c.stroke();}
    else if(p.k==='mud'){c.fillStyle=`rgba(40,28,16,${a})`;circ(c,p.x,p.y,p.r);}
    else if(p.k==='steam'){c.fillStyle=`rgba(255,255,255,${.35*a})`;circ(c,p.x,p.y,p.r);}
    else if(p.k==='chip'){c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.fillStyle='#e9dfbd';c.strokeStyle='#5e4a2a';c.lineWidth=1.5;c.beginPath();c.moveTo(-p.r,0);c.quadraticCurveTo(0,-6,p.r,0);c.quadraticCurveTo(0,-2,-p.r,0);c.fill();c.stroke();c.restore();}
    else if(p.k==='spark'){c.fillStyle=p.c;c.globalAlpha=a;c.beginPath();for(let k=0;k<8;k++){const r=k%2?p.r*.4:p.r,an=k*Math.PI/4;c.lineTo(p.x+Math.cos(an)*r,p.y+Math.sin(an)*r);}c.fill();c.globalAlpha=1;}
    else if(p.k==='drop'){c.globalAlpha=a;c.fillStyle=p.c;circ(c,p.x,p.y,p.r);c.globalAlpha=1;}
    else if(p.k==='hair'){c.save();c.globalAlpha=a;c.translate(p.x,p.y);c.rotate(p.rot);c.strokeStyle='#3a2a18';c.lineWidth=1.3;c.beginPath();c.moveTo(-p.r/2,0);c.quadraticCurveTo(0,-3,p.r/2,0);c.stroke();c.restore();}
    else if(p.k==='curl'){c.globalAlpha=Math.min(1,a*2);drawCurl(c,p.x,p.y,p.r,p.rot);c.globalAlpha=1;}
    else if(p.k==='heart'){c.globalAlpha=a;c.fillStyle='#f06292';c.font=`${p.r*1.6}px sans-serif`;c.textAlign='center';c.fillText('♥',p.x,p.y);c.globalAlpha=1;}
  }
  for(const f of FT){if(f.s!==scr)continue;const a=clamp(f.life/f.max*1.6,0,1),age=f.max-f.life,pz=age<.18?.6+.4*(1-Math.pow(1-age/.18,3))*1.12:age<.28?1.12-.12*(age-.18)/.1:1;c.globalAlpha=a;c.font=`${Math.round(f.size*pz)}px ${DISPLAY}`;c.textAlign='center';c.lineWidth=4;c.lineJoin='round';c.strokeStyle='rgba(30,20,10,.85)';c.strokeText(f.t,f.x,f.y);c.fillStyle=f.c;c.fillText(f.t,f.x,f.y);c.globalAlpha=1;}
}
function draw(t){
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
  if(!C||!IMG.chair)return;
  let sx=0,sy=0;if(shake>0){sx=(Math.random()-.5)*8*shake/.3;sy=(Math.random()-.5)*6*shake/.3;}
  ctx.setTransform(dpr*sc,0,0,dpr*sc,dpr*(ox+sx*sc),dpr*(oy+sy*sc));
  const e=ease(entry);
  drawScene(ctx,t);drawImg(ctx,chairImg(),ART.chair);drawDecor(ctx,t);
  ctx.save();ctx.translate(face==='shiver'?Math.sin(t*50)*1.5:0,(1-e)*-340);drawFrog(ctx,t);ctx.restore();
  drawDaylight(ctx);
  ctx.save();ctx.translate(FO.x,(1-e)*340+R.jy*.12+FO.y);
  if(bucket>.01)drawBucketBack(ctx,bucket);
  drawFoot(ctx,t);
  if(bucket>.01)drawBucketFront(ctx,bucket,t);
  if(M&&M.type==='massage')drawMassage(ctx,t);
  if(M&&M.type==='paint')drawPaintHints(ctx,t);
  if(M&&SVC[M.type])SVC[M.type].draw(ctx,t);
  if(M&&M.type==='peel'&&ptrF){if(peeling)drawCurl(ctx,M.curl.x,M.curl.y,M.curl.s,0);drawBlade(ctx,ptrF[0],ptrF[1]);}
  if(M&&M.type==='scrub'&&ptrF){const r=15+S.up.brush*5;ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=2;ctx.setLineDash([3,4]);ctx.beginPath();ctx.arc(ptrF[0],ptrF[1],r,0,TAU);ctx.stroke();ctx.setLineDash([]);}
  if(C.boss)bmDrawFoot(ctx,t);
  drawParticles(ctx,false);
  ctx.restore();
  if(C.boss)bmDrawUI(ctx,t);
  if(M&&M.type==='soak')drawThermo(ctx);
  if(M&&M.type==='scrub'&&C.tickles.length)drawTickleMeter(ctx);
  if(Q)drawQTE(ctx,t);
  drawParticles(ctx,true);
}

let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt,now/1000);draw(now/1000);coachTick();requestAnimationFrame(loop);}

/* ---------- boot ---------- */
try{document.fonts&&document.fonts.load("20px 'ZCOOL KuaiLe'");}catch(e){}
setMuteIcon();hud();requestAnimationFrame(loop);loadArt().then(()=>{setChapter();buildMask();dayGoal=goalFor(S.day);seat(makeSpec());entry=1;showTitle();});
})();
</script>

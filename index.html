<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#163a35">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}*,*::before,*::after{box-sizing:border-box}body{margin:0;font-size:14px;overscroll-behavior:none}img{max-width:100%}[hidden]{display:none!important}</style>
<title>奶蛙足道</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap">
<style>
/* Layout: one-screen phone column on bathhouse tiles — neon shop sign, paper service ticket, canvas stage, wooden tool tray */
:root{
  --tile:#3a8a7f; --tile-line:#2f7268; --deep:#163a35;
  --wood:#c08447; --wood-dark:#6f4220; --wood-light:#e4b57c;
  --sign:#c4302a; --gold:#f5c95c; --paper:#fbf4e4; --paper-line:#e2d3b4;
  --ink:#2b2118; --ink-soft:#6b5a48;
  --good:#3f9d4a; --warn:#e08a1e; --bad:#c4302a;
  --display:'ZCOOL KuaiLe','Hiragino Sans GB','PingFang SC','Microsoft YaHei',sans-serif;
  --body:'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;
  color-scheme: light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--deep);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-color:var(--tile);
  background-image:linear-gradient(var(--tile-line) 2px,transparent 2px),linear-gradient(90deg,var(--tile-line) 2px,transparent 2px);
  background-size:34px 34px;background-position:-1px -1px}

/* header */
.top{display:flex;align-items:center;gap:8px;min-width:0}
.sign small{font-size:11px;letter-spacing:.15em;margin-left:4px;opacity:.85;vertical-align:middle}
.stats .chip{white-space:nowrap}
.sign{background:var(--sign);color:var(--gold);font-family:var(--display);font-size:22px;letter-spacing:.08em;padding:3px 12px 4px;border-radius:8px;
  border:2px solid var(--gold);box-shadow:0 0 0 3px var(--sign),0 0 14px rgba(245,201,92,.45);text-shadow:0 0 6px rgba(245,201,92,.7);white-space:nowrap}
.stats{margin-left:auto;display:flex;gap:6px;align-items:center}
.chip{background:rgba(22,58,53,.75);color:var(--paper);padding:4px 10px;border-radius:999px;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.coin{background:var(--gold);color:var(--ink);font-weight:700}
.chip.coin.pop{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.25)}}
.icon-btn{width:32px;height:32px;border-radius:50%;border:0;background:rgba(22,58,53,.75);color:var(--paper);display:grid;place-items:center;flex:none}

/* ticket */
.ticket{background:var(--paper);border-radius:4px 4px 10px 10px;padding:8px 12px 10px;box-shadow:0 3px 0 rgba(0,0,0,.18);position:relative;display:flex;flex-direction:column;gap:6px}
.ticket::before{content:"";position:absolute;left:0;right:0;top:-5px;height:6px;background:radial-gradient(circle at 5px 0,transparent 4px,var(--paper) 4.5px) 0 0/10px 6px repeat-x}
.t-head{display:flex;align-items:baseline;gap:8px}
.tag{font-size:11px;background:var(--wood-dark);color:var(--paper);padding:1px 6px;border-radius:3px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.t-head b{font-family:var(--display);font-size:19px;font-weight:400}
.kind{font-family:var(--body);font-size:12px;color:var(--ink-soft);margin-left:6px;font-weight:400}
.t-count{margin-left:auto;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.quote{margin:0;font-size:14px;color:var(--ink);min-height:1.4em;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.st{font-size:12px;padding:2px 8px;border-radius:999px;border:1.5px dashed var(--paper-line);color:var(--ink-soft);display:inline-flex;align-items:center;gap:4px}
.st.cur{border-style:solid;border-color:var(--sign);color:var(--sign);font-weight:700}
.st.done{background:var(--good);border-color:var(--good);color:#fff;border-style:solid}
.st i{width:9px;height:9px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.25)}
.pat{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-soft)}
.bar{flex:1;height:8px;background:var(--paper-line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--good);border-radius:4px;transition:background .3s}

/* stage */
.stage{flex:1;min-height:0;position:relative}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.instr{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);background:rgba(22,40,36,.82);color:var(--paper);padding:6px 14px 7px;border-radius:12px;font-size:13px;
  text-align:center;width:max-content;max-width:94%;pointer-events:none;display:flex;flex-direction:column;gap:5px;line-height:1.35}
.instr.flash{animation:shk .35s}
@keyframes shk{25%{transform:translateX(calc(-50% - 6px))}75%{transform:translateX(calc(-50% + 6px))}}
.prog{height:6px;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--gold)}
.swatches{position:absolute;top:4px;right:0;display:flex;flex-direction:column;gap:6px}
.sw{display:flex;align-items:center;gap:6px;background:var(--paper);border:2px solid transparent;border-radius:999px;padding:3px 10px 3px 4px;font-size:12px;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.sw span{width:20px;height:20px;border-radius:50%;border:1.5px solid rgba(0,0,0,.25)}
.sw.sel{border-color:var(--sign);font-weight:700}

.tags{display:flex;flex-wrap:wrap;gap:5px}
.tg{border:0;font-size:11px;padding:2px 7px;border-radius:4px;background:var(--wood-dark);color:var(--gold);letter-spacing:.04em;line-height:1.5}
.tg.herb{background:#4d7a3a;color:#f3f7e8}
.st.new{animation:newp .8s 4}
@keyframes newp{50%{background:var(--gold);border-color:var(--gold);color:var(--ink)}}
.pd{display:inline-flex;gap:2px;margin-left:2px}
.pd i{width:8px;height:8px;border-radius:50%;border:1px solid rgba(0,0,0,.3);display:inline-block}
.pd i.empty{border-style:dashed;background:transparent}
.card{background:var(--paper);border-radius:10px;padding:5px 9px;font-size:11px;display:flex;align-items:center;gap:6px;box-shadow:0 2px 0 rgba(0,0,0,.2);color:var(--ink-soft)}
.card .pd i{width:14px;height:14px}
.sw.erase span{background:repeating-linear-gradient(45deg,#fff 0 3px,#cfc7b8 3px 6px)}
.chat{position:absolute;top:4px;left:0;max-width:62%;background:var(--paper);border-radius:12px;padding:8px 10px;box-shadow:0 3px 0 rgba(0,0,0,.2);display:flex;flex-direction:column;gap:6px;font-size:13px;z-index:2;line-height:1.4}
.chat p{margin:0}
.chat .ca{display:flex;flex-direction:column;gap:4px}
.chat button{border:1.5px solid var(--paper-line);background:#fff;border-radius:8px;padding:6px 8px;text-align:left;font-size:12.5px}
.chat button:active{background:var(--gold)}
.chat .tm{height:3px;background:var(--paper-line);border-radius:2px;overflow:hidden}
.chat .tm i{display:block;height:100%;width:100%;background:var(--sign)}
.news{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px;line-height:1.5}
.menu .x{color:var(--ink-soft);font-size:11px}
.tool.locked{opacity:.38;filter:grayscale(.85)}

.bench{display:flex;align-items:center;gap:6px;background:rgba(22,58,53,.6);border-radius:10px;padding:4px 8px;min-height:44px;overflow:hidden}
.bl{font-size:11px;color:var(--paper);opacity:.8;writing-mode:vertical-rl;letter-spacing:.2em;flex:none}
.be{font-size:12px;color:var(--paper);opacity:.6}
.bn{margin-left:auto;font-size:11.5px;color:var(--gold);flex:none;white-space:nowrap}
.dclock{margin-left:auto;flex:none;display:flex;align-items:center;gap:5px;background:rgba(10,24,22,.45);border-radius:8px;padding:3px 7px 3px 4px;color:var(--paper);line-height:1.15}
.bn+.dclock{margin-left:6px}
.dclock svg{width:22px;height:22px;flex:none}
.dclock b{display:block;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.dclock small{display:block;font-size:10.5px;opacity:.8;white-space:nowrap}
.dclock.late small{color:var(--gold);opacity:1}
#app{isolation:isolate}
.sky{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.sky i{position:absolute;display:block}
.sky .grade{inset:0;background:var(--sky-c,#fff);opacity:var(--sky-o,0);mix-blend-mode:soft-light}
.sky .dusk{inset:0;background:linear-gradient(180deg,#2b2f6e,#5a3a6e 55%,#c0603e);opacity:var(--sky-d,0);mix-blend-mode:multiply}
.sky .beam{top:-25%;height:150%;width:58%;left:var(--beam-x,20%);transform:rotate(var(--beam-r,20deg));transform-origin:50% 0;
  background:linear-gradient(90deg,transparent 0,rgba(var(--beam-c,255,240,200),.9) 12%,rgba(var(--beam-c,255,240,200),.9) 43%,transparent 47%,transparent 53%,rgba(var(--beam-c,255,240,200),.9) 57%,rgba(var(--beam-c,255,240,200),.9) 88%,transparent 100%);
  opacity:var(--beam-o,0);mix-blend-mode:soft-light;filter:blur(10px)}
@media (prefers-reduced-motion: no-preference){.sky .beam,.sky .grade,.sky .dusk{transition:opacity 1.2s,left 1.2s,transform 1.2s,background-color 1.2s}}
.bs{display:flex;align-items:center;gap:4px;background:var(--paper);border-radius:8px;padding:3px 6px 3px 3px;min-width:0;animation:bin .35s}
@keyframes bin{from{transform:translateY(-8px);opacity:0}}
.bs>svg{width:30px;height:25px;flex:none}
.bo{display:flex;flex-direction:column;gap:3px;min-width:0;overflow:hidden}
.bi{display:flex;gap:1px}
.bi svg{width:14px;height:14px}
.bp{display:block;width:100%;min-width:36px;height:4px;background:var(--paper-line);border-radius:2px;overflow:hidden}
.bp b{display:block;height:100%;width:100%;background:var(--good)}
.lvbar{display:flex;flex-direction:column;gap:5px;font-size:13px}
.lvt{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.lvs{color:var(--gold);letter-spacing:2px;text-shadow:0 1px 0 var(--wood-dark)}
.lvtrack{position:relative;height:8px;background:var(--paper-line);border-radius:4px}
.lvtrack i{display:block;height:100%;background:var(--gold);border-radius:4px}
.lvtrack b{position:absolute;top:-3px;width:2px;height:14px;background:var(--wood-dark);transform:translateX(-1px)}
.lvg{display:flex;justify-content:space-between;color:var(--ink-soft);font-size:11.5px;font-variant-numeric:tabular-nums}
.bigstars{font-size:46px;color:var(--gold);text-align:center;letter-spacing:8px;text-shadow:0 2px 0 var(--wood-dark);line-height:1}
.bigstars span,.bigstars.dim{color:var(--paper-line);text-shadow:none}
.unlockcard{display:flex;gap:10px;align-items:center;background:#fff3cf;border-radius:10px;padding:10px}
.unlockcard.new{background:var(--sign);color:var(--paper)}
.unlockcard svg{width:40px;height:40px;flex:none;background:var(--paper);border-radius:8px;padding:4px}
.unlockcard div{display:flex;flex-direction:column;gap:2px;font-size:13px;line-height:1.45}
.unlockcard b{font-size:15px}
.item.lock{opacity:.55}
.menu .x{color:var(--ink-soft);font-size:11px}

.dbg{display:flex;flex-direction:column;gap:6px}
.dbg>b{font-size:14px}
.dgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.dgrid.wide{grid-template-columns:repeat(2,1fr)}
.dg{border:1.5px solid var(--paper-line);background:#fff;border-radius:8px;padding:7px 4px;font-size:13px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.25;font-variant-numeric:tabular-nums}
.dgrid.wide .dg{flex-direction:row;justify-content:center;gap:5px;flex-wrap:wrap}
.dg small{font-size:10.5px;color:var(--ink-soft)}
.dg svg{width:20px;height:20px}
.dg.on{border-color:var(--sign);background:#fde7e3}
.dg[disabled]{opacity:.4;cursor:not-allowed}

.coach{position:absolute;inset:0;z-index:15;pointer-events:none}
.coach.notarget{background:rgba(10,24,22,.55)}
.coach.under{display:none}
.cring{position:absolute;border-radius:14px;box-shadow:0 0 0 3px var(--gold),0 0 0 9999px rgba(10,24,22,.5);transition:all .25s;animation:cr 1.4s infinite}
@keyframes cr{50%{box-shadow:0 0 0 6px var(--gold),0 0 0 9999px rgba(10,24,22,.5)}}
.chand{position:absolute;width:40px;height:50px;margin-left:-14px;margin-top:-4px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
.chand svg{width:100%;height:100%}
.chand::before{content:"";position:absolute;left:4px;top:-6px;width:20px;height:20px;border-radius:50%;border:3px solid #fff;opacity:0}
.chand.g-tap{animation:gtap 1.1s infinite}
.chand.g-tap::before{animation:grip 1.1s infinite}
@keyframes gtap{0%,100%{transform:translate(6px,12px)}40%,55%{transform:translate(0,0)}}
@keyframes grip{40%{opacity:.9;transform:scale(.4)}80%{opacity:0;transform:scale(1.8)}}
.chand.g-hold{animation:ghold 2s infinite}
.chand.g-hold::before{animation:ghr 2s infinite}
@keyframes ghold{0%{transform:translate(6px,12px)}15%,85%{transform:translate(0,0)}100%{transform:translate(6px,12px)}}
@keyframes ghr{15%{opacity:.9;transform:scale(.4)}85%{opacity:.7;transform:scale(2.4)}100%{opacity:0}}
.chand.g-swipe{animation:gsw 1.4s ease-in-out infinite}
@keyframes gsw{0%,100%{transform:translateX(-55px)}50%{transform:translateX(55px)}}
.chand.g-down{animation:gdn 1.3s ease-in infinite}
@keyframes gdn{0%{transform:translateY(-6px);opacity:0}15%{opacity:1}80%{transform:translateY(46px);opacity:1}100%{transform:translateY(52px);opacity:0}}
.cbub{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:30%;background:var(--paper);color:var(--ink);border-radius:14px;padding:12px 14px;box-shadow:0 6px 0 rgba(0,0,0,.2),0 0 0 3px var(--gold);pointer-events:auto;display:flex;flex-direction:column;gap:8px;max-width:440px;margin:0 auto;animation:cbin .3s}
.coach .cbub[style*="bottom"]{top:auto}
@keyframes cbin{from{transform:translateY(8px);opacity:0}}
.cbub p{margin:0;font-size:15px;line-height:1.55}
.cbub b{color:var(--sign)}
.cstep{font-size:11px;letter-spacing:.08em;color:var(--ink-soft)}
.cbtns{display:flex;justify-content:flex-end;align-items:center;gap:10px}
.cbtns:has(.cbtn[hidden]):has(.cskip[hidden]){display:none}
.cbtn{border:0;border-radius:10px;padding:8px 16px;background:var(--sign);color:var(--paper);font-family:var(--display);font-size:17px;box-shadow:0 3px 0 #7d1d18}
.cskip{border:0;background:transparent;color:var(--ink-soft);font-size:12.5px;text-decoration:underline;margin-right:auto}
@media (prefers-reduced-motion: reduce){.chand,.chand::before,.cring{animation:none!important}.chand::before{opacity:.8}}

#app[data-ch="2"]{background-color:#7a4a2a;background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.22) 0 2px,transparent 2px 44px),linear-gradient(180deg,rgba(255,255,255,.07),rgba(0,0,0,.14));background-size:auto;background-position:0 0}
#app[data-ch="3"]{background-color:#4c6670;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.08) 0 3px,transparent 3px 24px),linear-gradient(180deg,rgba(255,255,255,.05),rgba(0,0,0,.16));background-size:auto;background-position:0 0}
#app[data-ch="2"] .sign{background:#1f1a17;box-shadow:0 0 0 3px #1f1a17,0 0 14px rgba(245,201,92,.45)}
#app[data-ch="3"] .sign{background:#8a5a2b;color:#fff3d6;border-color:#f6e3b0;box-shadow:0 0 0 3px #8a5a2b;text-shadow:none}

.chtag{font-family:var(--body);font-size:13px;color:var(--ink-soft);font-weight:400;margin-left:4px}
.chcard{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.chcard .chn{font-size:12px;letter-spacing:.3em;color:var(--ink-soft)}
.chcard b{font-family:var(--display);font-weight:400;font-size:38px;color:var(--sign);line-height:1.1}
.chcard .chs{font-size:13px;color:var(--ink-soft)}
.chcard svg{width:100%;border-radius:10px;margin:4px 0}
.chcard p{margin:0;font-size:14px;line-height:1.6;text-align:left}
.vipcard{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;background:linear-gradient(#fff6d6,#fbe7a8);border-radius:12px;padding:14px 12px;box-shadow:inset 0 0 0 2px #e0a72e}
.vipcard .vk{font-size:12px;letter-spacing:.3em;color:#8a5a10}
.vipcard b{font-family:var(--display);font-weight:400;font-size:30px;color:#8a3a10}
.vipcard p{margin:0;font-size:14px}
.vipcard .vr{font-size:13px;color:var(--ink-soft)}
.vipcard .vr.gold{color:#8a3a10;font-weight:700}
.tg.vip{background:linear-gradient(#f5d27a,#e0a72e);color:#4a2a08}
.bs.vip{box-shadow:0 0 0 2px var(--gold),0 0 10px rgba(245,201,92,.6)}

.tabs{display:flex;gap:6px}
.tabb{flex:1;border:1.5px solid var(--paper-line);background:#fff;border-radius:10px;padding:8px;font-family:var(--display);font-size:16px;color:var(--ink-soft)}
.tabb.on{background:var(--sign);border-color:var(--sign);color:var(--paper)}
.pips i.cap{background:repeating-linear-gradient(45deg,var(--paper-line) 0 2px,transparent 2px 4px)}

.effbox{display:flex;flex-direction:column;gap:2px;background:#fff3cf;border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.5}
.effbox b{font-size:13.5px}
.decohead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:6px;font-size:12px;color:var(--ink-soft)}
.decohead b{font-size:14.5px;color:var(--ink)}
.decogrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.decoit{display:flex;flex-direction:column;align-items:center;gap:2px;border:1.5px solid var(--paper-line);border-radius:10px;padding:6px 4px;text-align:center;min-width:0;background:#fff}
.decoit.has{background:#eef7e6;border-color:#9cc27a}
.decoit img{width:52px;height:52px}
.decoit b{font-size:12.5px}
.decoit span{font-size:10.5px;color:var(--ink-soft);line-height:1.3;min-height:2.6em}
.decoit .buy{min-width:0;width:100%;padding:5px 2px;font-size:12px;grid-row:auto;grid-column:auto}

.bosscard{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:linear-gradient(#3a1a14,#6a2418);color:#fbe7c8;border-radius:12px;padding:14px 12px;box-shadow:inset 0 0 0 2px #e0a72e}
.news li.brule{background:#fff1d6;border-radius:8px;padding:6px 8px;list-style:none;margin-left:-14px;box-shadow:inset 0 0 0 1.5px #e0a72e}
.bosscard .bk{font-size:12px;letter-spacing:.3em;color:#f5c95c}
.bosscard b{font-family:var(--display);font-weight:400;font-size:32px;color:#ffd58a}
.bosscard p{margin:0;font-size:14px;line-height:1.6}
.bosscard.win{background:linear-gradient(#fff6d6,#fbe7a8);color:var(--ink)}
.bosscard.win b{color:#8a3a10}.bosscard.win .bk{color:#8a5a10}
.bosscard.lose{background:linear-gradient(#3c3c40,#26262a)}
.tg.boss{background:linear-gradient(#3a1a14,#8a2418);color:#ffd58a}
.tg.dem{background:#ff9a6b;color:#3a1a0a;animation:newp .8s 3}
.pat.boss .bar{background:linear-gradient(90deg,transparent calc(60% - 1px),var(--wood-dark) calc(60% - 1px) 60%,transparent 60% calc(75% - 1px),var(--wood-dark) calc(75% - 1px) 75%,transparent 75% calc(90% - 1px),var(--wood-dark) calc(90% - 1px) 90%,transparent 90%),var(--paper-line);overflow:visible}
.pat.boss .bar i{opacity:.92}

/* tray */
.tray.two{gap:5px;padding:5px}
.tray.two .tool{padding:4px 2px 3px}
.tray.two .tool svg{width:24px;height:24px}
.tray{display:grid;grid-template-columns:repeat(var(--cols,7),1fr);gap:6px;background:var(--wood-dark);padding:6px;border-radius:12px;box-shadow:inset 0 2px 0 rgba(255,255,255,.12)}
.tool{border:0;border-radius:9px;background:linear-gradient(var(--wood-light),var(--wood));box-shadow:0 3px 0 #4d2c12;padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;color:var(--ink)}
.tool svg{width:30px;height:30px}
.tool small{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tool:active{transform:translateY(2px);box-shadow:0 1px 0 #4d2c12}
.tool.active{background:linear-gradient(#fff3c8,var(--gold));box-shadow:0 0 0 2px var(--paper),0 3px 0 #4d2c12}
.tool.hint{animation:glow 1s infinite}
.tool.no{animation:no .3s}
@keyframes glow{50%{box-shadow:0 0 0 3px var(--gold),0 3px 0 #4d2c12}}
@keyframes no{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(12,32,29,.72);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.panel{background:var(--paper);color:var(--ink);border-radius:14px;width:100%;max-width:380px;max-height:100%;overflow:auto;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.panel h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0;text-wrap:balance}
.panel p{margin:0;line-height:1.6;font-size:14px}
.muted{color:var(--ink-soft);font-size:13px}
.bigsign{background:var(--sign);border-radius:14px;padding:14px 10px 12px;text-align:center;border:3px solid var(--gold);
  box-shadow:inset 0 0 0 5px var(--sign),inset 0 0 0 7px rgba(245,201,92,.55),0 0 22px rgba(196,48,42,.4)}
.bigsign b{display:block;font-family:var(--display);font-weight:400;color:var(--gold);font-size:46px;letter-spacing:.12em;text-shadow:0 0 10px rgba(245,201,92,.8);line-height:1.1}
.bigsign span{color:var(--paper);font-size:13px;letter-spacing:.3em}
.menu{border:1.5px solid var(--paper-line);border-radius:8px;padding:8px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px;font-variant-numeric:tabular-nums}
.menu .h{grid-column:1/-1;font-family:var(--display);font-size:16px;color:var(--sign)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;border:0;border-radius:10px;padding:11px 14px;font-family:var(--display);font-size:18px;background:var(--sign);color:var(--paper);box-shadow:0 3px 0 #7d1d18;min-width:120px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #7d1d18}
.btn.ghost{background:transparent;color:var(--ink-soft);box-shadow:none;border:1.5px solid var(--paper-line);font-family:var(--body);font-size:13px;flex:0 1 auto}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.receipt{font-variant-numeric:tabular-nums;display:flex;flex-direction:column;gap:6px;font-size:14px;border-top:1.5px dashed var(--paper-line);border-bottom:1.5px dashed var(--paper-line);padding:10px 0}
.row{display:flex;gap:8px;align-items:baseline}
.row .dots{flex:1;border-bottom:1.5px dotted var(--paper-line);transform:translateY(-4px)}
.row.total{font-family:var(--display);font-size:22px;color:var(--sign)}
.row .x{color:var(--ink-soft);font-size:12px}
.stars{font-size:26px;color:var(--gold);letter-spacing:4px;text-shadow:0 1px 0 var(--wood-dark)}
.say{background:#fff;border-radius:12px;padding:8px 12px;font-size:14px;position:relative;border:1.5px solid var(--paper-line)}
.shop{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;border:1.5px solid var(--paper-line);border-radius:10px;padding:8px 10px}
.item b{font-size:15px}
.item .d{font-size:12px;color:var(--ink-soft);grid-column:1}
.pips{display:flex;gap:3px;grid-column:1}
.pips i{width:14px;height:5px;border-radius:2px;background:var(--paper-line)}
.pips i.on{background:var(--good)}
.buy{grid-row:1/4;grid-column:2;border:0;border-radius:8px;padding:8px 10px;background:var(--gold);font-weight:700;font-variant-numeric:tabular-nums;box-shadow:0 2px 0 var(--wood-dark);min-width:68px}
.buy[disabled]{background:var(--paper-line);color:var(--ink-soft);box-shadow:none;cursor:not-allowed}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:430px){.sign{font-size:18px;padding:2px 8px 3px;letter-spacing:.04em}.sign small{font-size:10px;margin-left:2px}.stats{gap:4px}.chip{padding:4px 7px;font-size:12px}.icon-btn{width:28px;height:28px}.top{gap:6px}}

function useTool(id,btn){
  ac();
  if(paused||!C||C.done||entry<1)return;
  if(TUT.on){if(!TUT.expect)return;if(id!==TUT.expect){flashInstr('先点亮起来的那个');sfx.bad();return;}}
  if(id!=='towel'&&UNLOCK[id]>S.day){flashInstr(`「${STEPS[id].n}」第 ${UNLOCK[id]} 天解锁`);return;}
  if(M){flashInstr('先把手上这一步做完');return;}
  if(C.boss&&bmBlock(id))return;
  if(id==='towel'){
    if(C.boss&&C.si<C.steps.length){flashInstr('Boss 的项目还没做完，不能结账');sfx.bad();return;}
    if(C.si<C.steps.length&&!towelArm){towelArm=true;flashInstr('还有项目没做，再点一次毛巾直接结账');setTimeout(()=>towelArm=false,2600);return;}
    towelArm=false;checkout(false);return;
  }
  if(C.si>=C.steps.length){say('都弄完啦，擦干结账吧～');hintTool('towel');return;}
  const need=C.steps[C.si];
  if(id===need){startMini(id);return;}
  C.pat-=8;wrongCount++;setFace('angry',1.2);shake=.3;sfx.bad();
  say(!C.steps.includes(id)?`我没点${STEPS[id].n}啊！`:pick(LINES.wrong));
  if(btn){btn.classList.remove('no');void btn.offsetWidth;btn.classList.add('no');}
  if(wrongCount>=2){flashInstr(`提示：下一步是「${STEPS[need].n}」`);hintTool(need);}else flashInstr('工具不对，客人不高兴了');
}

function startMini(t){
  sfx.tap();R.fly=null;const K=cfg(S.day),now=performance.now();
  if(SVC[t]){M=Object.assign({type:t,t0:now},SVC[t].start());setInstr(SVC[t].how);progress(0);updateTray();tutEv('mini',t);firstHint(t);return;}
  if(t==='soak'){
    M={type:'soak',T:31,prog:0,need:K.soakNeed,over:0,hotT:0,saidB:false,saidC:false,herb:null,herbWrong:0,tint:null,gustT:3+Math.random()*3,capHint:false,t0:now};
    const z=soakZone();
    if(C.herb){renderHerbs();$('swatches').hidden=false;}
    setInstr(`按住画面加热水，保持在 ${Math.round(z[0])}–${Math.round(z[1])}°`+(C.herb?`，再放一把${C.herb.n}`:''));
  }
  if(t==='scrub'){
    M={type:'scrub',clean:0,mt:0,dirty:true,tk:0,lastT:0,kicks:0,t0:now};
    let s='在脚底来回搓，把黑泥搓干净';if(C.lumps.length)s+='；硬泥块要多搓几下';if(C.tickles.length)s+='；粉色痒痒肉要慢慢搓';setInstr(s);
  }
  if(t==='peel'){M={type:'peel',clean:0,mt:0,dirty:false,bad:0,curls:0,curl:{x:0,y:0,s:0},badStroke:false,lastT:0,t0:now};setInstr('顺着箭头往下刮，一块刮得差不多就会整块掉下来；一直往上推会疼');}
  if(t==='trim'){
    M={type:'trim',miss:0,filing:false,t0:now};
    let s='点长指甲把它剪掉，别夹到肉';if(C.nails.some(n=>n.thick))s+='；厚指甲要剪几下';if(C.callus)s+='；脚跟老茧按住来回锉';setInstr(s);
  }
  if(t==='massage'){
    const pts=[];for(let i=0;i<K.mNotes;i++){let p;do{p=pick(POINTS);}while(pts.length&&p===pts[pts.length-1]);pts.push(p);}
    if(C.has('insomnia')){const ins=POINTS.find(p=>p.n==='失眠点');pts.splice(2,0,ins);pts.push(ins);}
    const seq=pts.map(p=>({p,type:K.rapid&&Math.random()<.2?'rapid':K.hold&&Math.random()<.28?'hold':'tap'}));
    M={type:'massage',seq,k:0,r:56,wait:.6,score:0,spd:44*K.mSpeed*(1-.08*toolLv('massage')),holding:false,hfill:0,hq:0,taps:0,rt:1.8,t0:now};
    let s='光圈缩到金圈上时点穴位';if(K.hold)s+='；「长按」要按住到满';if(K.rapid)s+='；「连点」快速点 5 下';setInstr(s);
  }
  if(t==='paint'){M={type:'paint',color:null,wrong:0,t0:now};renderSwatches();$('swatches').hidden=false;setInstr(`照右上角卡片涂：${C.paint.label}。先选颜色，再点脚趾`);}
  progress(0);updateTray();

}
function finish(step,q){
  hintOff();tutEv('finish',step);
  C.q[step]=q;C.si++;
  const el=(performance.now()-M.t0)/1000;
  M=null;hold=false;scrubbing=false;$('swatches').hidden=true;
  if(step==='scrub')fadeDirt=1;
  if(step==='peel')peelFade=1;
  sfx.ding();setFace('happy',1.6);R.jv=-170;
  addFT(q>=.9?'完美！':q>=.7?'不错':'凑合',180,250,q>=.9?'#f5c95c':'#ffffff',26,1);
  if(C.has('rush')&&el<10){C.fast+=6;addFT('快手奖 +¥6',180,280,'#f5c95c',18,1);}
  renderTicket();updateTray();progress(null);
  if(C.si<C.steps.length)setInstr('这步完成！选下一件工具');else{setInstr('全部做完，用毛巾擦干结账');hintTool('towel');}
  bossAfterFinish(step,q);
  if(!C.evented&&!C.vip&&!DBG.solo&&!TUT.on&&Math.random()<cfg(S.day).eventP){C.evented=true;const cc=C;setTimeout(()=>{if(C===cc)serviceEvent();},1100);}
}
function serviceEvent(){
  if(!C||C.done||M||paused)return;
  const U=cfg(S.day).unlock,lastIdx=ORDER.indexOf(C.steps[C.si-1]);
  const remaining=C.steps.slice(C.si);
  const addable=U.filter(s=>!C.steps.includes(s)&&ORDER.indexOf(s)>lastIdx&&s!=='soak'&&s!=='scrub');
  const opts=[];if(addable.length)opts.push('add','add');if(remaining.includes('paint'))opts.push('repaint');if(remaining.some(s=>s!=='paint'))opts.push('drop');
  if(!opts.length)return;
  const o=pick(opts);
  if(o==='add'){const s=pick(addable);
    if(s==='trim'){C.nails=genNails(S.day,true);}
    if(s==='paint'){C.paint=genPaint(S.day);}
    if(s==='peel'){buildPeel(cfg(S.day).patches);}
    if(SVC[s])SVC[s].init(true);
    C.steps=C.steps.slice(0,C.si).concat(ORDER.filter(x=>remaining.includes(x)||x===s));C.added=s;
    say(s==='trim'?'哎，我指甲好长，顺便帮我剪剪！':`对了，顺便给我做个${STEPS[s].n}吧！`);}
  else if(o==='repaint'){C.paint=genPaint(S.day);C.added='paint';say(`美甲我改主意了，换成${C.paint.label}！`);}
  else{const s=pick(remaining.filter(x=>x!=='paint'));C.steps=C.steps.filter(x=>x!==s);if(s==='trim')C.nails.forEach(n=>n.long=false);say(`${STEPS[s].n}就不做了，我赶时间。`);}
  sfx.croak();R.sacT=.5;renderTicket();flashInstr('客人改单了，看一下单子');
  if(C.si>=C.steps.length){setInstr('全部做完，用毛巾擦干结账');hintTool('towel');}
}

function clawMid(i){const n=C.nails[i],[dx,dy]=toeDir(i),t=TIPS[i];return[t[0]+dx*(8+n.len*.6),t[1]+dy*(8+n.len*.6)];}

function trimProgress(){
  const tot=C.nails.reduce((a,n)=>a+(n.long?(n.thick?3:1):0),0)+(C.callus?3:0);
  const left=C.nails.reduce((a,n)=>a+(n.long&&!n.clipped?n.hp:0),0)+(C.callus?Math.max(0,C.callus.hp)*3:0);
  progress(tot?1-left/tot:1);
}
function checkTrimDone(){trimProgress();if(C.nails.every(n=>!n.long||n.clipped)&&(!C.callus||C.callus.hp<=0))finish('trim',Math.max(.3,1-.15*M.miss));}
function tryClip(x,y){
  const rad=18+S.up.clip*6;let best=-1,bd=1e9;
  C.nails.forEach((n,i)=>{if(!n.long||n.clipped)return;const [mx,my]=clawMid(i);const d=Math.hypot(x-mx,y-my);if(d<bd){bd=d;best=i;}});
  if(best>=0&&bd<rad){
    const n=C.nails[best];n.hp--;const [mx,my]=clawMid(best);sfx.clip();
    if(n.hp>0){addFT('咔！还差 '+n.hp+' 下',mx,my-14,'#ffffff',15);shake=.1;PS.push({k:'chip',x:mx,y:my,vx:(Math.random()-.5)*120,vy:-100,life:.8,max:.8,r:4,rot:0,vr:8});trimProgress();return;}
    n.clipped=true;
    PS.push({k:'chip',x:mx,y:my,vx:(Math.random()-.5)*160,vy:-120-Math.random()*60,life:1.1,max:1.1,r:n.len*.5,rot:0,vr:(Math.random()-.5)*14});

    M.miss++;C.pat-=6;setFace('ouch',1);say(pick(LINES.ouch));sfx.bad();shake=.35;addFT('夹到肉',x,y-10,'#ff8a80',18);

function tryPaint(x,y){
  let best=-1,bd=1e9;TIPS.forEach((t,i)=>{const d=Math.hypot(x-t[0],y-t[1]);if(d<bd){bd=d;best=i;}});

function checkout(angry){
  if(!C||C.done)return;
  tutEv('checkout');hintOff();
  C.done=true;M=null;Q=null;hold=false;scrubbing=false;peeling=false;$('swatches').hidden=true;closeChat();updateTray();
  if(C.boss){bossEnd(!angry);return;}
  const k=C.has('picky')?1.3:1;
  const rows=C.steps.map(s=>({s,q:C.q[s],amt:C.q[s]!=null?Math.round(STEPS[s].p*C.q[s]*k*(1+.1*toolLv(s))):0}));
  let sum=rows.reduce((a,r)=>a+r.amt,0);
  const undone=rows.filter(r=>r.q==null).length;
  const avg=rows.reduce((a,r)=>a+(r.q||0),0)/rows.length;
  let stars=angry?1:clamp(Math.round(avg*3.2+C.pat/100*1.8),1,5);
  if(!angry&&C.has('picky')&&rows.some(r=>r.q!=null&&r.q<.85))stars=Math.max(1,stars-1);
  let tip=0,cut=0;
  if(angry){cut=sum-Math.round(sum*.5);sum-=cut;}
  else if(!undone)tip=Math.round(sum*.3*(C.pat/100)*(1+decoEff('tip'))*(stars>=4?1:.5)*(C.has('rich')?2:1));
  const extras=angry?[]:[['快手奖',C.fast],['聊天小费',C.chatTip],['应变奖',C.qteTip]].filter(x=>x[1]>0);
  let vipB=0;if(!angry&&C.vip){const v=C.vip,ok=v.strict?rows.every(r=>r.q!=null&&r.q>=.9):stars>=4&&!undone;vipB=ok?Math.round(sum*(v.mult-1)*.4):0;if(vipB){extras.push(['贵客打赏',vipB]);setTimeout(()=>{tone(1319,1319,.1,'square',.05);tone(1568,1568,.2,'square',.05,.1);},300);}}
  const total=sum+tip+extras.reduce((a,x)=>a+x[1],0);
  S.coins+=total;dayEarn+=total;dayStars.push(stars);S.served++;save();hud();popCoin();
  if(total>0)setTimeout(()=>sfx.coin(),150);
  if(!angry){setFace(undone?'angry':'bliss',99);}
  const line=angry?'不洗了！再也不来了！':C.vip?(vipB?C.vip.done:C.vip.bad):undone?'怎么没弄完就让我走？':pick(LINES.done);
  setTimeout(()=>showReceipt(rows,tip,cut,total,stars,line,angry,extras),angry?500:350);
}

  fish:{text:'<b>鱼疗</b>：小鱼会自己把脚啄干净。<b>点小泡泡</b>能把鱼引过去；调皮的<b>大鱼</b>出现就点它赶走。',gesture:'tap',pos:()=>{const f=C.flecks&&C.flecks.find(f=>f.a>0);return f?[f.x,f.y]:null;}},
  wax:{text:'<b>脱脚毛</b>：点有脚毛的地方<b>贴蜡条</b>，来回<b>抹平</b>，指针走到<b>绿区</b>时点一下撕掉。',gesture:'tap',pos:()=>{const h=C.hair&&C.hair.find(h=>h.state==='hair');return h?[h.x,h.y]:null;}},
  moxa:{text:'<b>拔罐</b>：点<b>发光的穴位</b>扣上火罐，罐子<b>变绿</b>时点它取下。放太久会烫。',gesture:'tap',pos:()=>{const p=M&&M.pts&&M.pts.find(q=>q.state==='glow');return p?[p.x,p.y]:null;}},
  art:{text:'<b>足部彩绘</b>：从<b>闪烁的点</b>开始，<b>沿着虚线</b>描出图案。画到线外会扣分。',gesture:'swipe',pos:()=>{const p=C.art&&C.art.pts.find(q=>!q.ok);return p?[p.x,p.y]:null;}},
  trim:{text:'<b>修脚</b>：点长出来的<b>指甲尖</b>剪掉。别点到脚趾肉上。',gesture:'tap',pos:()=>{const i=C.nails.findIndex(n=>n.long&&!n.clipped);return i<0?null:clawMid(i);}},
  peel:{text:'<b>去角质</b>：在淡紫色角质膜上<b>顺着箭头往下刮</b>，一块刮掉一半多就会<b>整块掉下来</b>。手指一直往上推会疼。',gesture:'down',pos:()=>{const p=C.patches[0];return p?[p.x,p.y-p.ry*.6]:null;}},
  massage:{text:'<b>足底按摩</b>：白圈会慢慢缩小，<b>缩到金圈上</b>时点那个穴位，越准越舒服。',gesture:'tap',pos:()=>{const nt=M&&M.seq[M.k];return nt?[nt.p.x,nt.p.y]:null;}},
  paint:{text:'<b>美甲</b>：照右上角卡片，<b>先点颜色</b>，再点对应的<b>脚趾</b>。涂错了用卸甲水擦掉。',gesture:'tap',target:'#swatches'}
};
function firstHint(t){
  if(TUT.on||DBG.solo&&S.seen&&S.seen[t])return;
  S.seen=S.seen||{};if(S.seen[t]||!HINTS[t])return;
  const h=HINTS[t];S.seen[t]=1;save();TUT.hint=t;TUT.hintT=performance.now();paused=true;
  coach({target:h.target||'#stageWrap',gesture:h.gesture,gpos:h.pos?()=>{const p=h.pos();return p?stageXY(p[0],p[1]):null;}:null,text:h.text,btn:'知道了',onBtn:hintOff,stepLabel:'新项目'});
}
function hintOff(){if(TUT.hint){TUT.hint=null;coachOff();if($('ov').hidden)paused=false;}}


/* ---------- new services (module per service) ---------- */
function layerCanvas(){const c=document.createElement('canvas');c.width=W*DS;c.height=H*DS;return c;}
const MSK=layerCanvas(),msc=MSK.getContext('2d'),ARTC=layerCanvas(),arc=ARTC.getContext('2d');
let FOOTPX=1;
function clipFoot(x){x.setTransform(DS,0,0,DS,0,0);x.globalCompositeOperation='destination-in';drawImg(x,IMG.fclean,ART.foot);x.globalCompositeOperation='source-over';}
function clearLayer(x){x.setTransform(1,0,0,1,0,0);x.globalCompositeOperation='source-over';x.clearRect(0,0,W*DS,H*DS);}
function lbl(c,txt,x,y,col,size){c.font=`${size||13}px ${DISPLAY}`;c.textAlign='center';c.lineWidth=3;c.lineJoin='round';c.strokeStyle='rgba(30,20,10,.82)';c.strokeText(txt,x,y);c.fillStyle=col||'#fff';c.fillText(txt,x,y);}
const SVC={};
const SVC_LAYERS=['fish','wax','moxa','art','mask'];

/* 足膜：抹 → 等干 → 撕 */
SVC.mask={
  how:'按住在脚底抹匀绿泥膜，把整只脚盖满',
  init(on){clearLayer(msc);},
  start(){clearLayer(msc);return{phase:'smear',cov:0,mt:0,dirty:false,dry:0,need:2.2-.4*toolLv('mask'),pokes:0,pull:0,pulling:false,sy:0,smearing:false,rip:0,tab:{x:158,y:349}};},
  dab(x0,y0,x1,y1){msc.setTransform(DS,0,0,DS,0,0);msc.globalCompositeOperation='source-over';msc.lineCap='round';msc.strokeStyle='#7fae5a';msc.lineWidth=26+5*toolLv('mask');msc.beginPath();msc.moveTo(x0,y0);msc.lineTo(x1,y1);msc.stroke();
    msc.fillStyle='rgba(165,205,120,.7)';for(let i=0;i<2;i++){msc.beginPath();msc.arc(x1+(Math.random()-.5)*20,y1+(Math.random()-.5)*20,2+Math.random()*4,0,TAU);msc.fill();}
    clipFoot(msc);M.dirty=true;},
  down(x,y){
    if(M.phase==='smear'){M.smearing=true;this.dab(x,y,x,y);}
    else if(M.phase==='dry'){if(onFoot(x,y)){M.pokes++;C.pat-=3;setFace('angry',.8);say('还没干呢，别乱戳！');sfx.bad();addFT('还没干',x,y-12,'#ff8a80',15);}}
    else if(M.phase==='peel'){if(Math.hypot(x-M.tab.x,y-M.tab.y)<32){M.pulling=true;M.sy=y;tone(300,200,.05,'sine',.05);}else flashInstr('按住脚跟下面的小角往上撕');}
  },
  move(p,lp){
    if(M.phase==='smear'&&M.smearing){this.dab(lp[0],lp[1],p[0],p[1]);if(Math.random()<.3)PS.push({k:'drop',x:p[0],y:p[1],vx:(Math.random()-.5)*40,vy:-30,life:.5,max:.5,r:2.5,c:'#7fae5a'});if(bubT<=0){tone(180+Math.random()*60,120,.05,'sine',.04);bubT=.12;}if(Math.random()<.04)setFace('bliss',.6);}
    else if(M.phase==='peel'&&M.pulling){M.pull=Math.max(0,M.sy-p[1]);if(M.pull>90)this.rip();}
  },
  up(){M.smearing=false;M.pulling=false;},
  rip(){M.phase='ripped';M.pulling=false;M.rip=0;noise(.25,.35,900);tone(700,200,.2,'triangle',.08,.05);setFace('ouch',.5);shake=.2;
    setTimeout(()=>{if(C&&!C.done){setFace('bliss',1.4);say(pick(['啪！好爽！','脚底像剥了壳的鸡蛋！','舒服，滑溜溜的。']));}},450);
    for(let i=0;i<14;i++)PS.push({k:'drop',x:100+Math.random()*120,y:180+Math.random()*160,vx:(Math.random()-.5)*120,vy:-120-Math.random()*80,life:.9,max:.9,r:2+Math.random()*3,c:'#9cc27a'});},
  update(dt){
    if(M.phase==='smear'){M.mt-=dt;if(M.dirty&&M.mt<=0){M.mt=.15;M.dirty=false;M.cov=countCanvas(MSK)/FOOTPX;progress(M.cov/.88);if(M.cov>=.88){M.phase='dry';M.smearing=false;setInstr('泥膜正在变干，别碰它，等它裂开');say('凉凉的，好舒服～');}}}
    else if(M.phase==='dry'){M.dry+=dt;progress(M.dry/M.need);setFace('bliss',.2);
      msc.setTransform(1,0,0,1,0,0);msc.globalCompositeOperation='source-atop';msc.fillStyle=`rgba(214,222,170,${dt*.9})`;msc.fillRect(0,0,MSK.width,MSK.height);
      if(Math.random()<dt*7){msc.setTransform(DS,0,0,DS,0,0);msc.strokeStyle='rgba(110,120,70,.6)';msc.lineWidth=1;let x=90+Math.random()*130,y=160+Math.random()*180;msc.beginPath();msc.moveTo(x,y);for(let k=0;k<4;k++){x+=(Math.random()-.5)*14;y+=(Math.random()-.5)*14;msc.lineTo(x,y);}msc.stroke();}
      msc.globalCompositeOperation='source-over';
      if(M.dry>=M.need){M.phase='peel';setInstr('干了！按住脚跟下面的小角，往上一把撕下来');sfx.ding();progress(1);}}
    else if(M.phase==='peel'){if(!M.pulling)M.pull=Math.max(0,M.pull-dt*300);}
    else if(M.phase==='ripped'){M.rip+=dt*2.2;if(M.rip>=1&&!M.fin){M.fin=true;finish('mask',Math.max(.5,1-.12*M.pokes));}}
  },
  layer(c){
    if(!(M&&M.type==='mask'))return;
    let off=0,rot=0,a=1;
    if(M.phase==='peel'){off=-M.pull*.35;rot=-M.pull*.0015;}
    if(M.phase==='ripped'){off=-40-M.rip*260;rot=-.15-M.rip*.5;a=1-M.rip;}
    c.save();c.globalAlpha=Math.max(0,a);c.translate(158,350);c.rotate(rot);c.translate(-158,-350+off);c.drawImage(MSK,0,0,W,H);c.restore();
  },
  draw(c,t){
    if(M.phase!=='peel')return;
    const tb=M.tab,pul=.5+.5*Math.sin(t*6),oy=-M.pull*.35;
    c.fillStyle='#c9d99a';c.strokeStyle='#5c7a32';c.lineWidth=1.5;c.beginPath();c.moveTo(tb.x-15,tb.y-8+oy);c.lineTo(tb.x+15,tb.y-8+oy);c.lineTo(tb.x+9,tb.y+9+oy);c.lineTo(tb.x-9,tb.y+9+oy);c.closePath();c.fill();c.stroke();
    if(!M.pulling){c.strokeStyle=`rgba(255,240,170,${.5+.5*pul})`;c.lineWidth=2.5;c.beginPath();c.arc(tb.x,tb.y,22,0,TAU);c.stroke();
      c.fillStyle='#fff';c.beginPath();c.moveTo(tb.x,tb.y-38-pul*6);c.lineTo(tb.x-8,tb.y-26-pul*6);c.lineTo(tb.x+8,tb.y-26-pul*6);c.closePath();c.fill();lbl(c,'往上撕',tb.x+44,tb.y-4,'#ffe9a0',13);}
  }
};

/* 鱼疗：小鱼啄泡泡，赶走大鱼 */
function drawFish(c,x,y,a,ph,s,col,big){
  c.save();c.translate(x,y);c.rotate(a);if(Math.cos(a)<0)c.scale(1,-1);
  const tw=Math.sin(ph)*.35;
  c.fillStyle=col;c.strokeStyle=big?'#6a2a0a':'rgba(40,60,70,.8)';c.lineWidth=big?1.8:1.2;
  c.save();c.translate(-s*.9,0);c.rotate(tw);c.beginPath();c.moveTo(0,0);c.lineTo(-s*.8,-s*.55);c.lineTo(-s*.8,s*.55);c.closePath();c.fill();c.stroke();c.restore();
  c.beginPath();c.ellipse(0,0,s,s*.58,0,0,TAU);c.fill();c.stroke();
  c.fillStyle='#1e1a16';circ(c,s*.5,-s*.12,big?2.6:1.5);
  if(big){c.strokeStyle='#6a2a0a';c.lineWidth=1.6;c.beginPath();c.arc(s*.7,s*.2,s*.12,0,Math.PI);c.stroke();c.fillStyle='rgba(255,140,120,.5)';circ(c,s*.35,s*.15,s*.12);
    c.strokeStyle='#6a2a0a';c.lineWidth=2;c.beginPath();c.moveTo(s*.25,-s*.44);c.lineTo(s*.62,-s*.3);c.stroke();}
  c.restore();
}
SVC.fish={
  how:'小鱼会自己把脚啄干净，点小泡泡能把鱼引过去；调皮的大鱼来了快点它赶走',
  init(on){C.flecks=on?footSpots(20+Math.min(10,Math.max(0,S.day-13)),5,150,345).map(p=>({x:p.x,y:p.y,a:1,rot:Math.random()*3})):[];},
  start(){const fish=[];const nf=6+2*toolLv('fish');for(let i=0;i<nf;i++){const a=i/nf*TAU;fish.push({x:158+Math.cos(a)*95,y:250+Math.sin(a)*110,vx:0,vy:0,ph:Math.random()*6,tgt:null,c:pick(['#8fd0e8','#b6e0a0','#f4c2d8','#f7d37a'])});}
    return{fish,big:null,bigT:2.8,bites:0,shoo:0,lure:null,eaten:0,total:Math.max(1,C.flecks.length),water:0};},
  down(x,y){const b=M.big;if(b&&b.state!=='leave'&&Math.hypot(x-b.x,y-b.y)<30){b.state='leave';b.vx=(b.x<158?-1:1)*260;M.shoo++;addFT('赶走了！',b.x,b.y-18,'#f5c95c',15);sfx.perfect();for(let i=0;i<8;i++)PS.push({k:'drop',x:b.x,y:b.y,vx:(Math.random()-.5)*140,vy:-80-Math.random()*60,life:.6,max:.6,r:2+Math.random()*2,c:'#bfe6f5'});return;}
    M.lure={x,y,t:1.4};tone(900,1200,.05,'sine',.04);for(let i=0;i<5;i++)PS.push({k:'drop',x,y,vx:(Math.random()-.5)*60,vy:-30-Math.random()*30,life:.5,max:.5,r:2,c:'#e6f6ff'});},
  update(dt){
    M.water=Math.min(1,M.water+dt*2);
    if(M.lure){M.lure.t-=dt;if(M.lure.t<=0)M.lure=null;}
    const left=C.flecks.filter(f=>f.a>0);
    for(const f of M.fish){
      let tgt=null;
      if(M.lure){let bd=1e9;for(const fl of left){const d=Math.hypot(fl.x-M.lure.x,fl.y-M.lure.y);if(d<bd){bd=d;tgt=fl;}}}
      if(!tgt){if(f.tgt&&f.tgt.a>0)tgt=f.tgt;else{let bd=1e9;for(const fl of left){const d=Math.hypot(fl.x-f.x,fl.y-f.y)+Math.random()*40;if(d<bd){bd=d;tgt=fl;}}}}
      f.tgt=tgt;const spd=M.lure?150:70;
      if(tgt){const dx=tgt.x-f.x,dy=tgt.y-f.y,d=Math.hypot(dx,dy)||1;
        if(d>5){f.vx+=(dx/d*spd-f.vx)*Math.min(1,dt*4);f.vy+=(dy/d*spd-f.vy)*Math.min(1,dt*4);}
        else{f.vx*=.8;f.vy*=.8;tgt.a-=dt*1.6;if(tgt.a<=0){M.eaten++;PS.push({k:'spark',x:tgt.x,y:tgt.y,vx:0,vy:-30,life:.4,max:.4,r:3,c:'#fff8d8'});if(bubT<=0){tone(700,1100,.04,'sine',.035);bubT=.08;}if(Math.random()<.15)setFace(Math.random()<.5?'tickle':'bliss',.6);}}}
      else{f.vx*=.95;f.vy*=.95;}
      f.x+=f.vx*dt;f.y+=f.vy*dt;f.ph+=dt*(8+Math.hypot(f.vx,f.vy)*.05);
    }
    if(!M.big){M.bigT-=dt;if(M.bigT<=0&&left.length){const side=Math.random()<.5?-1:1,tg=pick(left);M.big={x:side<0?40:290,y:190+Math.random()*130,tx:tg.x,ty:tg.y,state:'come',t:0,vx:0,ph:0};M.bigT=Math.max(2.6,5.2-(S.day-13)*.25)+Math.random()*1.5;tone(160,120,.2,'sawtooth',.05);}}
    else{const b=M.big;b.ph+=dt*10;
      if(b.state==='come'){const dx=b.tx-b.x,dy=b.ty-b.y,d=Math.hypot(dx,dy);if(d>6){b.x+=dx/d*90*dt;b.y+=dy/d*90*dt;}else{b.state='bite';b.t=0;}}
      else if(b.state==='bite'){b.t+=dt;if(b.t>.5){M.bites++;C.pat-=8;setFace('ouch',1);shake=.4;sfx.bad();say(pick(['哎哟！这条大鱼啄得好用力！','大鱼太调皮啦！']));addFT('啄疼了',b.x,b.y-18,'#ff8a80',15);b.state='leave';b.vx=(b.x<158?-1:1)*200;}}
      else{b.x+=b.vx*dt;if(b.x<-60||b.x>420)M.big=null;}
    }
    progress(M.eaten/M.total);
    if(!left.length&&!M.fin){M.fin=true;finish('fish',Math.max(.4,1-.15*M.bites));}
  },
  layer(c){if(!C.flecks||!C.flecks.length||!C.steps.includes('fish')||C.q.fish!=null)return;
    for(const f of C.flecks){if(f.a<=0)continue;const r=1.6+3*f.a;c.globalAlpha=Math.min(1,f.a+.25);c.fillStyle='rgba(235,248,255,.9)';c.strokeStyle='rgba(120,190,230,.85)';c.lineWidth=1;c.beginPath();c.arc(f.x,f.y,r,0,TAU);c.fill();c.stroke();c.fillStyle='#fff';circ(c,f.x-r*.35,f.y-r*.35,r*.35);}c.globalAlpha=1;},
  draw(c,t){
    const w=M.water;c.save();c.globalAlpha=.3*w;c.fillStyle='#7cc6e8';c.beginPath();c.roundRect(52,105,214,268,26);c.fill();c.globalAlpha=1;
    c.strokeStyle=`rgba(220,245,255,${.65*w})`;c.lineWidth=3;c.beginPath();c.roundRect(52,105,214,268,26);c.stroke();
    c.strokeStyle=`rgba(255,255,255,${.5*w})`;c.lineWidth=1.5;c.beginPath();for(let x=60;x<=258;x+=6)c.lineTo(x,112+Math.sin(x*.08+t*3)*2.5);c.stroke();
    for(let i=0;i<8;i++){const bx=70+((i*37+t*12)%180),by=360-((t*40+i*53)%250);c.strokeStyle=`rgba(255,255,255,${.5*w})`;c.lineWidth=1;c.beginPath();c.arc(bx,by,2+i%3,0,TAU);c.stroke();}
    c.restore();
    for(const f of M.fish)drawFish(c,f.x,f.y,Math.atan2(f.vy,f.vx||.001),f.ph,9,f.c,false);
    if(M.big){const b=M.big;drawFish(c,b.x,b.y,b.state==='leave'?(b.vx>0?0:Math.PI):Math.atan2(b.ty-b.y,b.tx-b.x),b.ph,19,'#e8742e',true);
      if(b.state!=='leave'){const pul=.5+.5*Math.sin(t*12);c.strokeStyle=`rgba(255,90,70,${.6+.4*pul})`;c.lineWidth=2.5;c.beginPath();c.arc(b.x,b.y,28,0,TAU);c.stroke();lbl(c,'点它赶走！',b.x,b.y-34,'#ffd27a',13);}}
    if(M.lure){c.strokeStyle=`rgba(255,255,255,${M.lure.t/1.4})`;c.lineWidth=2;c.beginPath();c.arc(M.lure.x,M.lure.y,10+(1.4-M.lure.t)*20,0,TAU);c.stroke();}
  }
};

/* 脱脚毛：贴蜡条 → 抹平 → 看准时机撕 */
SVC.wax={
  how:'点有脚毛的地方贴蜡条，来回抹平，再看准时机一把撕下',
  init(on){C.hair=on?footSpots(S.day>=18?3:2,21,175,335).map(p=>{const hairs=[];for(let i=0;i<34;i++){const a=Math.random()*TAU,r=Math.sqrt(Math.random())*p.r;hairs.push({x:p.x+Math.cos(a)*r,y:p.y+Math.sin(a)*r*.8,a:-1.2+Math.random()*2.4,l:5+Math.random()*6,cu:(Math.random()-.5)*.8});}return Object.assign(p,{hairs,state:'hair',smooth:0,ang:(Math.random()-.5)*.6,flush:0});}):[];},
  start(){return{tm:null,misses:0,smoothing:null};},
  down(x,y){
    if(M.tm){const z=M.tm;this.rip(z.p,z.pos>=z.lo&&z.pos<=z.hi);return;}
    const p=C.hair.find(h=>h.state!=='done'&&Math.hypot(x-h.x,y-h.y)<h.r+12);if(!p)return;
    if(p.state==='hair'){p.state='strip';p.smooth=0;tone(400,300,.06,'triangle',.06);addFT('贴上了，来回抹平',p.x,p.y-p.r-10,'#ffffff',13);}
    M.smoothing=p;
  },
  move(p,lp,moved){const s=M.smoothing;if(!s||s.state!=='strip')return;
    if(Math.hypot(p[0]-s.x,p[1]-s.y)<s.r+18&&moved>.8){s.smooth+=moved*.014;if(bubT<=0){noise(.04,.08,1400);bubT=.07;}
      if(s.smooth>=1){s.state='ready';M.smoothing=null;M.tm={p:s,pos:0,dir:1,lo:.6-.02*toolLv('wax'),hi:.82+.05*toolLv('wax'),sp:.95+Math.min(.6,Math.max(0,S.day-15)*.07)};setInstr('指针走到绿区时点一下，一把撕下来！');sfx.tap();}}},
  up(){M.smoothing=null;},
  rip(p,ok){M.tm=null;
    if(ok){p.state='done';p.flush=1;noise(.18,.4,1600);tone(900,300,.15,'square',.05);setFace('ouch',.7);shake=.25;addFT('嘶啦！',p.x,p.y-p.r-8,'#ffffff',18);
      for(const h of p.hairs.slice(0,22))PS.push({k:'hair',x:h.x,y:h.y,vx:(Math.random()-.5)*120,vy:-140-Math.random()*80,life:1,max:1,r:h.l,rot:h.a,vr:(Math.random()-.5)*10});
      setTimeout(()=>{if(C&&!C.done){setFace('bliss',1);say(pick(['嗷——！……咦，好光滑！','疼一下，值了。','哇，脚底亮得能照镜子。']));}},600);
      if(C.hair.every(h=>h.state==='done'))setTimeout(()=>{if(M&&M.type==='wax'&&!M.fin){M.fin=true;finish('wax',Math.max(.4,1-.15*M.misses));}},700);
      else setInstr('下一块：点有脚毛的地方贴蜡条');}

/* ---------- boss mechanics: 挑刺 / 宫廷规矩 / 同行比拼 ---------- */
const BM_TAG={gourmet:'挑刺',prince:'宫廷规矩',onsen:'同行比拼'};
const RIVAL_PAR={soak:9,scrub:11,peel:10,trim:9,massage:13,paint:10,mask:12,fish:15,wax:14,moxa:14,art:13};
const RIVAL_GAP=2.5,BOWY=250,FORCE_LIM=1300;
function bmNew(id){
  if(id==='gourmet')return{k:'pick',phase:null,t:0,max:4,flaws:[],found:0,total:0,clean:0,rounds:0};
  if(id==='prince')return{k:'court',bow:null,bowedFor:-1,bows:0,bowOk:0,force:0,warned:false,rude:0,cool:0,lastT:0};
  if(id==='onsen')return{k:'race',rt:0,hers:0,lead:0,behind:0,end:null};
  return{k:''};
}
const BMm=()=>bossRun&&bossRun.m||null;
function bmSat(d,txt,x,y){C.pat=clamp(C.pat+d,0,100);addFT(`${txt} ${d>0?'+':d<0?'−':''}${d?Math.abs(d):''}`.trim(),x||180,y||300,d>0?'#b8f5c0':d<0?'#ff8a80':'#ffffff',16,1);renderTicket();}
function bmBegin(){const m=BMm();if(!m)return;const cc=C;
  if(m.k==='race')setTimeout(()=>{if(C===cc&&!C.done){say('阿汤，开始！让他们看看温泉山庄的手艺。');addFT('比拼开始！',180,110,'#ffd58a',22,1);sfx.croak();}},900);
}
function bmBusy(){const m=BMm();return !!m&&((m.k==='pick'&&!!m.phase)||(m.k==='court'&&!!m.bow));}
function bmAfterFinish(step,q){
  const m=BMm();if(!m)return;const cc=C;
  if(m.k==='pick'){m.phase='wait';setTimeout(()=>{if(C===cc&&!C.done&&m.phase==='wait')bmPick(q);},450);}
  if(m.k==='race'){
    const hers=rivalDone(m);
    if(C.si>hers){m.lead++;bmSat(3,'领先阿汤',180,330);}
    else if(C.si<hers){m.behind++;bmSat(-2,'落后阿汤',180,330);}

    if(C.si>=C.steps.length&&!m.end){m.end='win';bmSat(6,'比阿汤先做完！',180,360);setTimeout(()=>{if(C===cc)say('……这速度，可以啊。');},700);}
  }
}
function bmBlock(id){

function bmDown(fx,fy,sx,sy){
  const m=BMm();if(!m)return false;
  if(m.k==='pick'&&m.phase){
    if(m.phase!=='fix')return true;
    const f=m.flaws.find(f=>!f.ok&&Math.hypot(fx-f.x,fy-f.y)<f.r+16);
    if(f){f.ok=true;m.found++;C.pat=Math.min(100,C.pat+1);sfx.perfect();addFT('补好了',f.x+FO.x,f.y+FO.y-20,'#f5c95c',15);
      for(let i=0;i<7;i++)PS.push({k:'spark',x:f.x,y:f.y,vx:(Math.random()-.5)*120,vy:-50-Math.random()*60,life:.6,max:.6,r:3,c:pick(['#ffffff','#ffe9a8','#d8ccff'])});
      if(m.flaws.every(f=>f.ok))bmPickEnd();}
    else sfx.tap();
    return true;}
  if(m.k==='court'&&m.bow){if(Math.hypot(sx-180,sy-BOWY)<54){m.bow.holding=true;sfx.tap();}return true;}
  return false;
}
function bmUp(){const m=BMm();if(m&&m.k==='court'&&m.bow)m.bow.holding=false;}
function bmMove(d,ts){
  const m=BMm();if(!m||m.k!=='court'||!M)return;
  const dtm=(ts-m.lastT)/1000;m.lastT=ts;if(dtm<=0||dtm>.2||m.cool>0)return;
  const spd=d/dtm;if(spd<=FORCE_LIM)return;
  m.force+=(spd-FORCE_LIM)/FORCE_LIM*dtm*1.4;
  if(m.force>=.7&&!m.warned){m.warned=true;addFT('轻一点……',180,90,'#ffd58a',18,1);say('嗯？轻一点。');}
  if(m.force>=1){m.force=0;m.cool=1.2;m.rude++;C.pat-=6;setFace('angry',1.1);shake=.3;sfx.bad();say(pick(['放肆！轻一点！','本王的脚是你能这么使劲的吗？','粗鲁！']));addFT('用力过猛 −6',180,300,'#ff8a80',17,1);renderTicket();}
}
function rivalDone(m){let cum=0,n=0;for(const s of C.steps){cum+=(RIVAL_PAR[s]||11)+RIVAL_GAP;if(cum<=m.rt)n++;else break;}return n;}
function rivalFrac(m){let cum=0;for(let i=0;i<C.steps.length;i++){const d=(RIVAL_PAR[C.steps[i]]||11)+RIVAL_GAP;if(m.rt<cum+d)return(i+(m.rt-cum)/d)/C.steps.length;cum+=d;}return 1;}
function bmPick(q){
  const m=BMm(),n=q>=.9?1:q>=.7?2:3;
  m.flaws=footSpots(n,12,150,340).map(f=>({x:f.x,y:f.y,r:f.r,ok:false}));if(!m.flaws.length){m.phase=null;return;}
  m.phase='scan';m.t=1.1;m.total+=m.flaws.length;m.rounds++;m.max=(4+m.flaws.length*.7)*(1+decoEff('qte'));

}
function bmPickEnd(){

  else{bmSat(-4*miss,`漏了 ${miss} 处`,180,300);setFace('angry',1.2);say(pick(['这都看不出来？','啧，粗心。','细节！细节懂不懂？']));}

}
function bmBow(tool){

  tone(523,523,.1,'triangle',.06);tone(659,659,.15,'triangle',.06,.1);

function bmUpdate(dt,t){
  const m=BMm();if(!m)return;
  if(m.k==='pick'&&m.phase&&m.phase!=='wait'){
    m.t-=dt;
    if(m.phase==='scan'&&m.t<=0){m.phase='fix';m.t=m.max;flashInstr(`点掉放大镜圈出来的 ${m.flaws.length} 处毛病！`);say(pick(['这里，还有这里，不够讲究。','啧，这几处没弄好。','看见没？这儿。']));sfx.bad();}
    else if(m.phase==='fix'&&m.t<=0)bmPickEnd();
  }
  if(m.k==='court'){
    m.cool=Math.max(0,m.cool-dt);m.force=Math.max(0,m.force-dt*.45);if(m.force<.4)m.warned=false;
    const b=m.bow;
    if(b){b.t-=dt;if(b.holding)b.hf+=dt/.8;else b.hf=Math.max(0,b.hf-dt*.8);
      if(b.hf>=1){m.bow=null;m.bowOk++;m.bowedFor=C.si;bmSat(2,'礼数周到',180,300);say(pick(['平身。','嗯，懂规矩。','免礼，开始吧。']));setFace('happy',1);sfx.coin();bmUp();hold=false;startMini(b.tool);}
      else if(b.t<=0){m.bow=null;m.bowedFor=C.si;bmSat(-8,'失礼',180,300);setFace('angry',1.2);say('放肆！……罢了，开始吧。');sfx.bad();shake=.3;startMini(b.tool);}}
  }
  if(m.k==='race'&&!m.end){
    m.rt+=dt;const h=rivalDone(m);
    if(h>m.hers){m.hers=h;const s=C.steps[h-1];addFT(`阿汤做完了「${STEPS[s]?STEPS[s].n:''}」`,180,52,'#ffd58a',14,1);tone(392,523,.08,'square',.03);}

function drawMagnifier(c,x,y,s){

  c.strokeStyle='#f5c95c';c.lineWidth=3;c.beginPath();c.arc(p.x,p.y,16,0,TAU);c.stroke();
  if(nt.type==='hold'){
    if(M.holding){c.strokeStyle='#ff9a6b';c.lineWidth=6;c.beginPath();c.arc(p.x,p.y,22,-Math.PI/2,-Math.PI/2+TAU*M.hfill);c.stroke();label('按住别松…',p.y-34,'#ffd27a');}
    else{c.strokeStyle='#ff9a6b';c.lineWidth=6;c.beginPath();c.arc(p.x,p.y,Math.max(1,M.r),0,TAU);c.stroke();label('长按 · '+p.n,p.y-M.r-8,'#ffd27a');}
    return;}
  c.strokeStyle='rgba(255,255,255,.95)';c.lineWidth=3.5;c.beginPath();c.arc(p.x,p.y,Math.max(1,M.r),0,TAU);c.stroke();
  label(p.n,p.y-M.r-8);
}
function drawPaintHints(c,t){
  TIPS.forEach((tp,i)=>{const tg=C.paint.t[i],n=C.nails[i],ok=tg?n.paint===tg.c:!n.paint;if(ok)return;
    c.strokeStyle=!tg?`rgba(255,120,110,${.6+.4*Math.sin(t*8)})`:`rgba(255,255,255,${.5+.4*Math.sin(t*5+i)})`;c.lineWidth=2;c.setLineDash([5,4]);c.beginPath();c.arc(tp[0],tp[1],22,0,TAU);c.stroke();c.setLineDash([]);
    if(tg){c.fillStyle=tg.c;circ(c,tp[0]+17,tp[1]-17,5);c.strokeStyle='#fff';c.lineWidth=1.5;c.beginPath();c.arc(tp[0]+17,tp[1]-17,5,0,TAU);c.stroke();}});
}
function drawParticles(c,scr){
  for(const p of PS){if(!!p.s!==scr)continue;const a=clamp(p.life/p.max,0,1);
    if(p.k==='foam'){c.fillStyle=`rgba(255,255,255,${.85*a})`;circ(c,p.x,p.y,p.r);c.strokeStyle=`rgba(150,200,220,${.6*a})`;c.lineWidth=1;c.beginPath();c.arc(p.x,p.y,p.r,0,TAU);c.stroke();}
    else if(p.k==='mud'){c.fillStyle=`rgba(40,28,16,${a})`;circ(c,p.x,p.y,p.r);}
    else if(p.k==='steam'){c.fillStyle=`rgba(255,255,255,${.35*a})`;circ(c,p.x,p.y,p.r);}
    else if(p.k==='chip'){c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.fillStyle='#e9dfbd';c.strokeStyle='#5e4a2a';c.lineWidth=1.5;c.beginPath();c.moveTo(-p.r,0);c.quadraticCurveTo(0,-6,p.r,0);c.quadraticCurveTo(0,-2,-p.r,0);c.fill();c.stroke();c.restore();}
    else if(p.k==='spark'){c.fillStyle=p.c;c.globalAlpha=a;c.beginPath();for(let k=0;k<8;k++){const r=k%2?p.r*.4:p.r,an=k*Math.PI/4;c.lineTo(p.x+Math.cos(an)*r,p.y+Math.sin(an)*r);}c.fill();c.globalAlpha=1;}
    else if(p.k==='drop'){c.globalAlpha=a;c.fillStyle=p.c;circ(c,p.x,p.y,p.r);c.globalAlpha=1;}
    else if(p.k==='hair'){c.save();c.globalAlpha=a;c.translate(p.x,p.y);c.rotate(p.rot);c.strokeStyle='#3a2a18';c.lineWidth=1.3;c.beginPath();c.moveTo(-p.r/2,0);c.quadraticCurveTo(0,-3,p.r/2,0);c.stroke();c.restore();}
    else if(p.k==='curl'){c.globalAlpha=Math.min(1,a*2);drawCurl(c,p.x,p.y,p.r,p.rot);c.globalAlpha=1;}
    else if(p.k==='heart'){c.globalAlpha=a;c.fillStyle='#f06292';c.font=`${p.r*1.6}px sans-serif`;c.textAlign='center';c.fillText('♥',p.x,p.y);c.globalAlpha=1;}
  }
  for(const f of FT){if(f.s!==scr)continue;const a=clamp(f.life/f.max*1.6,0,1);c.globalAlpha=a;c.font=`${f.size}px ${DISPLAY}`;c.textAlign='center';c.lineWidth=4;c.lineJoin='round';c.strokeStyle='rgba(30,20,10,.85)';c.strokeText(f.t,f.x,f.y);c.fillStyle=f.c;c.fillText(f.t,f.x,f.y);c.globalAlpha=1;}
}
function draw(t){
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
  if(!C||!IMG.chair)return;
  let sx=0,sy=0;if(shake>0){sx=(Math.random()-.5)*8*shake/.3;sy=(Math.random()-.5)*6*shake/.3;}
  ctx.setTransform(dpr*sc,0,0,dpr*sc,dpr*(ox+sx*sc),dpr*(oy+sy*sc));
  const e=ease(entry);
  drawScene(ctx,t);drawImg(ctx,chairImg(),ART.chair);drawDecor(ctx,t);
  ctx.save();ctx.translate(face==='shiver'?Math.sin(t*50)*1.5:0,(1-e)*-340);drawFrog(ctx,t);ctx.restore();
  drawDaylight(ctx);
  ctx.save();ctx.translate(FO.x,(1-e)*340+R.jy*.12+FO.y);
  if(bucket>.01)drawBucketBack(ctx,bucket);
  drawFoot(ctx,t);
  if(bucket>.01)drawBucketFront(ctx,bucket,t);
  if(M&&M.type==='massage')drawMassage(ctx,t);
  if(M&&M.type==='paint')drawPaintHints(ctx,t);
  if(M&&SVC[M.type])SVC[M.type].draw(ctx,t);
  if(M&&M.type==='peel'&&ptrF){if(peeling)drawCurl(ctx,M.curl.x,M.curl.y,M.curl.s,0);drawBlade(ctx,ptrF[0],ptrF[1]);}
  if(M&&M.type==='scrub'&&ptrF){const r=15+S.up.brush*5;ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=2;ctx.setLineDash([3,4]);ctx.beginPath();ctx.arc(ptrF[0],ptrF[1],r,0,TAU);ctx.stroke();ctx.setLineDash([]);}
  if(C.boss)bmDrawFoot(ctx,t);
  drawParticles(ctx,false);
  ctx.restore();
  if(C.boss)bmDrawUI(ctx,t);
  if(M&&M.type==='soak')drawThermo(ctx);
  if(M&&M.type==='scrub'&&C.tickles.length)drawTickleMeter(ctx);
  if(Q)drawQTE(ctx,t);
  drawParticles(ctx,true);
}

let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt,now/1000);draw(now/1000);coachTick();requestAnimationFrame(loop);}

/* ---------- boot ---------- */
setMuteIcon();hud();requestAnimationFrame(loop);loadArt().then(()=>{setChapter();buildMask();dayGoal=goalFor(S.day);seat(makeSpec());entry=1;showTitle();});
})();
</script>

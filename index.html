/* Layout: one-screen phone column on bathhouse tiles — neon shop sign, paper service ticket, canvas stage, wooden tool tray */
:root{
  --tile:#3a8a7f; --tile-line:#2f7268; --deep:#163a35;
  --wood:#c08447; --wood-dark:#6f4220; --wood-light:#e4b57c;
  --sign:#c4302a; --gold:#f5c95c; --paper:#fbf4e4; --paper-line:#e2d3b4;
  --ink:#2b2118; --ink-soft:#6b5a48;
  --good:#3f9d4a; --warn:#e08a1e; --bad:#c4302a;
  --display:'ZCOOL KuaiLe','Hiragino Sans GB','PingFang SC','Microsoft YaHei',sans-serif;
  --body:'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;
  color-scheme: light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--deep);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-color:var(--tile);
  background-image:linear-gradient(var(--tile-line) 2px,transparent 2px),linear-gradient(90deg,var(--tile-line) 2px,transparent 2px);
  background-size:34px 34px;background-position:-1px -1px}

/* header */
.top{display:flex;align-items:center;gap:8px;min-width:0}
.sign small{font-size:11px;letter-spacing:.15em;margin-left:4px;opacity:.85;vertical-align:middle}
.stats .chip{white-space:nowrap}
.sign{background:var(--sign);color:var(--gold);font-family:var(--display);font-size:22px;letter-spacing:.08em;padding:3px 12px 4px;border-radius:8px;
  border:2px solid var(--gold);box-shadow:0 0 0 3px var(--sign),0 0 14px rgba(245,201,92,.45);text-shadow:0 0 6px rgba(245,201,92,.7);white-space:nowrap}
.stats{margin-left:auto;display:flex;gap:6px;align-items:center}
.chip{background:rgba(22,58,53,.75);color:var(--paper);padding:4px 10px;border-radius:999px;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.coin{background:var(--gold);color:var(--ink);font-weight:700}
.chip.coin.pop{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.25)}}
.icon-btn{width:32px;height:32px;border-radius:50%;border:0;background:rgba(22,58,53,.75);color:var(--paper);display:grid;place-items:center;flex:none}

/* ticket */
.ticket{background:var(--paper);border-radius:4px 4px 10px 10px;padding:8px 12px 10px;box-shadow:0 3px 0 rgba(0,0,0,.18);position:relative;display:flex;flex-direction:column;gap:6px}
.ticket::before{content:"";position:absolute;left:0;right:0;top:-5px;height:6px;background:radial-gradient(circle at 5px 0,transparent 4px,var(--paper) 4.5px) 0 0/10px 6px repeat-x}
.t-head{display:flex;align-items:baseline;gap:8px}
.tag{font-size:11px;background:var(--wood-dark);color:var(--paper);padding:1px 6px;border-radius:3px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.t-head b{font-family:var(--display);font-size:19px;font-weight:400}
.kind{font-family:var(--body);font-size:12px;color:var(--ink-soft);margin-left:6px;font-weight:400}
.t-count{margin-left:auto;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.quote{margin:0;font-size:14px;color:var(--ink);min-height:1.4em;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.st{font-size:12px;padding:2px 8px;border-radius:999px;border:1.5px dashed var(--paper-line);color:var(--ink-soft);display:inline-flex;align-items:center;gap:4px}
.st.cur{border-style:solid;border-color:var(--sign);color:var(--sign);font-weight:700}
.st.done{background:var(--good);border-color:var(--good);color:#fff;border-style:solid}
.st i{width:9px;height:9px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.25)}
.pat{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-soft)}
.bar{flex:1;height:8px;background:var(--paper-line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--good);border-radius:4px;transition:background .3s}

/* stage */
.stage{flex:1;min-height:0;position:relative}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.instr{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);background:rgba(22,40,36,.82);color:var(--paper);padding:6px 14px 7px;border-radius:12px;font-size:13px;
  text-align:center;width:max-content;max-width:94%;pointer-events:none;display:flex;flex-direction:column;gap:5px;line-height:1.35}
.instr.flash{animation:shk .35s}
@keyframes shk{25%{transform:translateX(calc(-50% - 6px))}75%{transform:translateX(calc(-50% + 6px))}}
.prog{height:6px;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--gold)}
.swatches{position:absolute;top:4px;right:0;display:flex;flex-direction:column;gap:6px}
.sw{display:flex;align-items:center;gap:6px;background:var(--paper);border:2px solid transparent;border-radius:999px;padding:3px 10px 3px 4px;font-size:12px;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.sw span{width:20px;height:20px;border-radius:50%;border:1.5px solid rgba(0,0,0,.25)}
.sw.sel{border-color:var(--sign);font-weight:700}

.tags{display:flex;flex-wrap:wrap;gap:5px}

.row .x{color:var(--ink-soft);font-size:12px}
.stars{font-size:26px;color:var(--gold);letter-spacing:4px;text-shadow:0 1px 0 var(--wood-dark)}
.say{background:#fff;border-radius:12px;padding:8px 12px;font-size:14px;position:relative;border:1.5px solid var(--paper-line)}
.shop{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;border:1.5px solid var(--paper-line);border-radius:10px;padding:8px 10px}
.item b{font-size:15px}
.item .d{font-size:12px;color:var(--ink-soft);grid-column:1}
.pips{display:flex;gap:3px;grid-column:1}
.pips i{width:14px;height:5px;border-radius:2px;background:var(--paper-line)}
.pips i.on{background:var(--good)}
.buy{grid-row:1/4;grid-column:2;border:0;border-radius:8px;padding:8px 10px;background:var(--gold);font-weight:700;font-variant-numeric:tabular-nums;box-shadow:0 2px 0 var(--wood-dark);min-width:68px}
.buy[disabled]{background:var(--paper-line);color:var(--ink-soft);box-shadow:none;cursor:not-allowed}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:430px){.sign{font-size:18px;padding:2px 8px 3px;letter-spacing:.04em}.sign small{font-size:10px;margin-left:2px}.stats{gap:4px}.chip{padding:4px 7px;font-size:12px}.icon-btn{width:28px;height:28px}.top{gap:6px}}
</style>

  const addable=U.filter(s=>!C.steps.includes(s)&&ORDER.indexOf(s)>lastIdx&&s!=='soak'&&s!=='scrub');
  const opts=[];if(addable.length)opts.push('add','add');if(remaining.includes('paint'))opts.push('repaint');if(remaining.some(s=>s!=='paint'))opts.push('drop');
  if(!opts.length)return;
  const o=pick(opts);
  if(o==='add'){const s=pick(addable);
    if(s==='trim'){C.nails=genNails(S.day,true);}
    if(s==='paint'){C.paint=genPaint(S.day);}
    if(s==='peel'){buildPeel(cfg(S.day).patches);}
    if(SVC[s])SVC[s].init(true);
    C.steps=C.steps.slice(0,C.si).concat(ORDER.filter(x=>remaining.includes(x)||x===s));C.added=s;
    say(s==='trim'?'哎，我指甲好长，顺便帮我剪剪！':`对了，顺便给我做个${STEPS[s].n}吧！`);}
  else if(o==='repaint'){C.paint=genPaint(S.day);C.added='paint';say(`美甲我改主意了，换成${C.paint.label}！`);}
  else{const s=pick(remaining.filter(x=>x!=='paint'));C.steps=C.steps.filter(x=>x!==s);if(s==='trim')C.nails.forEach(n=>n.long=false);say(`${STEPS[s].n}就不做了，我赶时间。`);}
  sfx.croak();R.sacT=.5;renderTicket();flashInstr('客人改单了，看一下单子');
  if(C.si>=C.steps.length){setInstr('全部做完，用毛巾擦干结账');hintTool('towel');}
}

/* ---------- checkout / level flow ---------- */
function checkout(angry){
  if(!C||C.done)return;
  tutEv('checkout');hintOff();
  C.done=true;M=null;Q=null;hold=false;scrubbing=false;peeling=false;$('swatches').hidden=true;closeChat();updateTray();
  if(C.boss){bossEnd(!angry);return;}
  const k=C.has('picky')?1.3:1;
  const rows=C.steps.map(s=>({s,q:C.q[s],amt:C.q[s]!=null?Math.round(STEPS[s].p*C.q[s]*k*(1+.1*toolLv(s))):0}));
  let sum=rows.reduce((a,r)=>a+r.amt,0);
  const undone=rows.filter(r=>r.q==null).length;
  const avg=rows.reduce((a,r)=>a+(r.q||0),0)/rows.length;
  let stars=angry?1:clamp(Math.round(avg*3.2+C.pat/100*1.8),1,5);
  if(!angry&&C.has('picky')&&rows.some(r=>r.q!=null&&r.q<.85))stars=Math.max(1,stars-1);
  let tip=0,cut=0;
  if(angry){cut=sum-Math.round(sum*.5);sum-=cut;}
  else if(!undone)tip=Math.round(sum*.3*(C.pat/100)*(1+decoEff('tip'))*(stars>=4?1:.5)*(C.has('rich')?2:1));
  const extras=angry?[]:[['快手奖',C.fast],['聊天小费',C.chatTip],['应变奖',C.qteTip]].filter(x=>x[1]>0);
  let vipB=0;if(!angry&&C.vip){const v=C.vip,ok=v.strict?rows.every(r=>r.q!=null&&r.q>=.9):stars>=4&&!undone;vipB=ok?Math.round(sum*(v.mult-1)*.4):0;if(vipB){extras.push(['贵客打赏',vipB]);setTimeout(()=>{tone(1319,1319,.1,'square',.05);tone(1568,1568,.2,'square',.05,.1);},300);}}
  const total=sum+tip+extras.reduce((a,x)=>a+x[1],0);
  S.coins+=total;dayEarn+=total;dayStars.push(stars);S.served++;save();if(total>0)flyCoins(Math.min(9,2+Math.ceil(total/25)));setTimeout(hud,450);
  if(total>0)setTimeout(()=>sfx.coin(),150);
  if(!angry){setFace(undone?'angry':'bliss',99);}
  const line=angry?'不洗了！再也不来了！':C.vip?(vipB?C.vip.done:C.vip.bad):undone?'怎么没弄完就让我走？':pick(LINES.done);
  setTimeout(()=>showReceipt(rows,tip,cut,total,stars,line,angry,extras),angry?500:350);
}
function showReceipt(rows,tip,cut,total,stars,line,angry,extras){

function tutEv(ev,a){
  if(!TUT.on)return;
  const n=TUT.step;

  else if(ev==='finish'&&n===4&&a==='soak')setTimeout(()=>tutGo(5),500);
  else if(ev==='mini'&&n===5&&a==='scrub')tutGo(6);

  start(){clearLayer(msc);return{phase:'smear',cov:0,mt:0,dirty:false,dry:0,need:2.2-.4*toolLv('mask'),pokes:0,pull:0,pulling:false,sy:0,smearing:false,rip:0,tab:{x:158,y:349}};},
  dab(x0,y0,x1,y1){msc.setTransform(DS,0,0,DS,0,0);msc.globalCompositeOperation='source-over';msc.lineCap='round';msc.strokeStyle='#7fae5a';msc.lineWidth=26+5*toolLv('mask');msc.beginPath();msc.moveTo(x0,y0);msc.lineTo(x1,y1);msc.stroke();
    msc.fillStyle='rgba(165,205,120,.7)';for(let i=0;i<2;i++){msc.beginPath();msc.arc(x1+(Math.random()-.5)*20,y1+(Math.random()-.5)*20,2+Math.random()*4,0,TAU);msc.fill();}
    clipFoot(msc);M.dirty=true;},
  down(x,y){
    if(M.phase==='smear'){M.smearing=true;this.dab(x,y,x,y);}
    else if(M.phase==='dry'){if(onFoot(x,y)){M.pokes++;C.pat-=3;setFace('angry',.8);say('还没干呢，别乱戳！');sfx.bad();addFT('还没干',x,y-12,'#ff8a80',15);}}
    else if(M.phase==='peel'){if(Math.hypot(x-M.tab.x,y-M.tab.y)<32){M.pulling=true;M.sy=y;tone(300,200,.05,'sine',.05);}else flashInstr('按住脚跟下面的小角往上撕');}
  },

    for(let i=0;i<14;i++)PS.push({k:'drop',x:100+Math.random()*120,y:180+Math.random()*160,vx:(Math.random()-.5)*120,vy:-120-Math.random()*80,life:.9,max:.9,r:2+Math.random()*3,c:'#9cc27a'});},
  update(dt){

      msc.setTransform(1,0,0,1,0,0);msc.globalCompositeOperation='source-atop';msc.fillStyle=`rgba(214,222,170,${dt*.9})`;msc.fillRect(0,0,MSK.width,MSK.height);

/* 鱼疗：小鱼啄泡泡，赶走大鱼 */
function drawFish(c,x,y,a,ph,s,col,big){
  c.save();c.translate(x,y);c.rotate(a);if(Math.cos(a)<0)c.scale(1,-1);
  const tw=Math.sin(ph)*.35;
  c.fillStyle=col;c.strokeStyle=big?'#6a2a0a':'rgba(40,60,70,.8)';c.lineWidth=big?1.8:1.2;
  c.save();c.translate(-s*.9,0);c.rotate(tw);c.beginPath();c.moveTo(0,0);c.lineTo(-s*.8,-s*.55);c.lineTo(-s*.8,s*.55);c.closePath();c.fill();c.stroke();c.restore();
  c.beginPath();c.ellipse(0,0,s,s*.58,0,0,TAU);c.fill();c.stroke();
  c.fillStyle='#1e1a16';circ(c,s*.5,-s*.12,big?2.6:1.5);
  if(big){c.strokeStyle='#6a2a0a';c.lineWidth=1.6;c.beginPath();c.arc(s*.7,s*.2,s*.12,0,Math.PI);c.stroke();c.fillStyle='rgba(255,140,120,.5)';circ(c,s*.35,s*.15,s*.12);
    c.strokeStyle='#6a2a0a';c.lineWidth=2;c.beginPath();c.moveTo(s*.25,-s*.44);c.lineTo(s*.62,-s*.3);c.stroke();}
  c.restore();
}
SVC.fish={
  how:'小鱼会自己把脚啄干净，点小泡泡能把鱼引过去；调皮的大鱼来了快点它赶走',

  R.tick=Math.max(0,R.tick-dt*1.4);
  R.melt+=((face==='bliss'?1:0)-R.melt)*Math.min(1,dt*4);
  R.sacT=Math.max(0,R.sacT-dt);
  R.sac+=((R.sacT>0?1:face==='angry'?.85:0)-R.sac)*Math.min(1,dt*8);
  if(!M&&C&&!C.done&&!paused&&entry>=1&&face==='neutral'&&C.pat>30){R.idle+=dt;if(R.idle>6&&!R.fly){R.fly={t:0,x:60,y:20,fx:60,fy:20};R.idle=0;}}else R.idle=0;
  if(R.fly){const f=R.fly;f.t+=dt;
    if(f.t<=2.6){f.x=MV[0]+Math.sin(f.t*2.1+1)*120;f.y=18+Math.sin(f.t*3.4)*12;f.fx=f.x;f.fy=f.y;}

}
function frogXf(c,t){

  c.scale(K.sx*(1+.05*R.melt-.006*br+ld*.09),K.sy*(1-.04*R.melt+.013*br-ld*.11));
  c.translate(-PIV[0],-PIV[1]);
}

  const n=C.nails[i],[dx,dy]=toeDir(i),tp=TIPS[i];
  const dirty=C.steps.includes('scrub')&&C.q.scrub==null;
  if(n.paint){c.fillStyle=n.paint;c.strokeStyle='#6b3f12';c.lineWidth=1.4;circ(c,tp[0]+dx*2,tp[1]+dy*2,8.5);c.beginPath();c.arc(tp[0]+dx*2,tp[1]+dy*2,8.5,0,TAU);c.stroke();
    c.fillStyle='rgba(255,255,255,.7)';c.beginPath();c.ellipse(tp[0]+dx*2-3,tp[1]+dy*2-3,2.2,3.6,-.6,0,TAU);c.fill();}
  c.save();c.translate(tp[0]+dx*9,tp[1]+dy*9);c.rotate(Math.atan2(dy,dx));
  if(n.long&&!n.clipped){
    const L=n.len*.85,w=n.thick?7.5:6,b=n.bend*4;
    const g=c.createLinearGradient(0,-w,0,w);g.addColorStop(0,dirty?'#d9c7a8':'#fffaf0');g.addColorStop(.55,dirty?'#c2ab86':'#f4e6cc');g.addColorStop(1,dirty?'#a98f6a':'#e2cfaa');
    c.fillStyle=g;c.strokeStyle=dirty?'#7a6040':'#b0905e';c.lineWidth=1.5;
    c.beginPath();c.moveTo(0,-w);c.lineTo(L-w,-w+b*.4);c.quadraticCurveTo(L+w*.6,b*.5,L-w,w+b*.4);c.lineTo(0,w);c.closePath();c.fill();c.stroke();
    c.strokeStyle='rgba(255,255,255,.85)';c.lineWidth=1.6;c.lineCap='round';c.beginPath();c.moveTo(3,-w*.45);c.lineTo(L-w-2,-w*.45+b*.3);c.stroke();
    if(n.thick){c.strokeStyle='rgba(150,115,70,.55)';c.lineWidth=1.2;for(let k=1;k<=3;k++){c.beginPath();c.moveTo(L*k/4.2,-w*.75);c.lineTo(L*k/4.2+1,w*.7);c.stroke();}c.strokeStyle='rgba(255,255,255,.95)';for(let k=0;k<3-n.hp;k++){c.beginPath();c.moveTo(L*.35+k*5,-w*.6);c.lineTo(L*.45+k*5,0);c.lineTo(L*.38+k*5,w*.5);c.stroke();}}
    if(M&&M.type==='trim'){c.strokeStyle=`rgba(245,201,92,${.5+.5*Math.sin(t*6)})`;c.lineWidth=2;c.setLineDash([4,4]);c.beginPath();c.arc(8+L*.6,n.bend*L*.25,12,0,TAU);c.stroke();c.setLineDash([]);}
  }else if(n.clipped&&!n.paint){c.fillStyle=dirty?'#8c6a48':'#efe2c2';c.strokeStyle='#6b4a2a';c.lineWidth=1.3;c.beginPath();c.ellipse(1,0,3.5,6.5,0,0,TAU);c.fill();c.stroke();}
  c.restore();
}
function drawBucketBack(c,k){const top=BT0-BTR*ease(k);c.strokeStyle='#6f4220';c.lineWidth=7;c.beginPath();c.ellipse(BX,top,BW+6,15,0,Math.PI,TAU);c.stroke();}
function drawBucketFront(c,k,t){
  const top=BT0-BTR*ease(k);const T=M&&M.type==='soak'?M.T:35;
  const hot=clamp((T-30)/25,0,1);
  c.fillStyle=`rgba(${120+hot*110},${200-hot*60},${225-hot*120},.6)`;
  c.beginPath();c.ellipse(BX,top+2,BW,13,0,Math.PI,TAU);
  for(let x=BX+BW;x>=BX-BW;x-=8)c.lineTo(x,top+2+Math.sin(x*.08+t*4)*2);c.closePath();c.fill();if(M&&M.tint){c.fillStyle=M.tint;c.globalAlpha=.4;c.fill();c.globalAlpha=1;}
  c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=1.5;c.beginPath();for(let x=BX-BW+8;x<=BX+BW-8;x+=6)c.lineTo(x,top-2+Math.sin(x*.07+t*3)*1.6);c.stroke();
  const g=c.createLinearGradient(BX-BW,0,BX+BW,0);g.addColorStop(0,'#8a5228');g.addColorStop(.5,'#c88a4c');g.addColorStop(1,'#7a461f');
  c.fillStyle=g;c.strokeStyle='#4d2c12';c.lineWidth=2.5;c.beginPath();c.moveTo(BX-BW-6,top);c.ellipse(BX,top,BW+6,15,0,Math.PI,0,true);c.lineTo(BX+BW-10,top+170);c.lineTo(BX-BW+10,top+170);c.closePath();c.fill();c.stroke();
  c.strokeStyle='rgba(60,30,10,.35)';c.lineWidth=1.5;
  for(let i=1;i<8;i++){const x0=BX-BW-6+i*(2*BW+12)/8,x1=BX-BW+10+i*(2*BW-20)/8;c.beginPath();c.moveTo(x0,top+14);c.lineTo(x1,top+170);c.stroke();}
  c.fillStyle='#4a4f55';[30,86].forEach(o=>{c.fillRect(BX-BW-4+o*.1,top+o,2*BW+8-o*.2,6);});
  c.strokeStyle='#6f4220';c.lineWidth=7;c.beginPath();c.ellipse(BX,top,BW+6,15,0,0,Math.PI);c.stroke();
}
function drawThermo(c){
  const x=336,y0=160,y1=340,[lo,hi]=soakZone();
  const ty=T=>y1-(T-22)/36*(y1-y0);
  c.fillStyle='rgba(255,255,255,.92)';c.strokeStyle='#2b2118';c.lineWidth=2;
  c.beginPath();c.roundRect(x-9,y0-8,18,y1-y0+16,9);c.fill();c.stroke();
  c.fillStyle='rgba(63,157,74,.45)';c.fillRect(x-7,ty(hi),14,ty(lo)-ty(hi));
  const T=M.T,col=T>hi+2?'#c4302a':T<lo-4?'#4b6fd6':'#e0612a';
  c.fillStyle=col;c.fillRect(x-4,ty(T),8,y1+8-ty(T));circ(c,x,y1+16,12);c.stroke();
  c.font=`14px ${DISPLAY}`;c.textAlign='center';c.lineWidth=3;c.strokeStyle='rgba(20,40,36,.85)';
  const s=Math.round(T)+'°';c.strokeText(s,x,y0-16);c.fillStyle='#fff';c.fillText(s,x,y0-16);
}
function drawMassage(c,t){
  if(M.k>=M.seq.length)return;
  const nt=M.seq[M.k],p=nt.p,nx=M.seq[M.k+1];
  if(nx){c.fillStyle='rgba(255,255,255,.4)';circ(c,nx.p.x,nx.p.y,4);}
  if(M.wait>0)return;
  c.font=`14px ${DISPLAY}`;c.textAlign='center';
  const label=(txt,y,col)=>{c.lineWidth=3;c.strokeStyle='rgba(30,20,10,.8)';c.strokeText(txt,p.x,y);c.fillStyle=col||'#fff';c.fillText(txt,p.x,y);};
  c.fillStyle='rgba(196,48,42,.85)';circ(c,p.x,p.y,6);
  if(nt.type==='rapid'){const pul=1+.15*Math.sin(t*20);
    c.strokeStyle='#ff9a6b';c.lineWidth=4;c.beginPath();c.arc(p.x,p.y,18*pul,0,TAU);c.stroke();
    c.strokeStyle='#f5c95c';c.lineWidth=3;c.beginPath();c.arc(p.x,p.y,26,-Math.PI/2,-Math.PI/2+TAU*clamp(M.rt/1.8,0,1));c.stroke();
    label(`连点 ${M.taps}/5`,p.y-34,'#ffd27a');label(p.n,p.y+44);return;}
  c.strokeStyle='#f5c95c';c.lineWidth=3;c.beginPath();c.arc(p.x,p.y,16,0,TAU);c.stroke();
  if(nt.type==='hold'){
    if(M.holding){c.strokeStyle='#ff9a6b';c.lineWidth=6;c.beginPath();c.arc(p.x,p.y,22,-Math.PI/2,-Math.PI/2+TAU*M.hfill);c.stroke();label('按住别松…',p.y-34,'#ffd27a');}
    else{c.strokeStyle='#ff9a6b';c.lineWidth=6;c.beginPath();c.arc(p.x,p.y,Math.max(1,M.r),0,TAU);c.stroke();label('长按 · '+p.n,p.y-M.r-8,'#ffd27a');}
    return;}
  c.strokeStyle='rgba(255,255,255,.95)';c.lineWidth=3.5;c.beginPath();c.arc(p.x,p.y,Math.max(1,M.r),0,TAU);c.stroke();
  label(p.n,p.y-M.r-8);
}
function drawPaintHints(c,t){
  TIPS.forEach((tp,i)=>{const tg=C.paint.t[i],n=C.nails[i],ok=tg?n.paint===tg.c:!n.paint;if(ok)return;
    c.strokeStyle=!tg?`rgba(255,120,110,${.6+.4*Math.sin(t*8)})`:`rgba(255,255,255,${.5+.4*Math.sin(t*5+i)})`;c.lineWidth=2;c.setLineDash([5,4]);c.beginPath();c.arc(tp[0],tp[1],22,0,TAU);c.stroke();c.setLineDash([]);
    if(tg){c.fillStyle=tg.c;circ(c,tp[0]+17,tp[1]-17,5);c.strokeStyle='#fff';c.lineWidth=1.5;c.beginPath();c.arc(tp[0]+17,tp[1]-17,5,0,TAU);c.stroke();}});
}
function drawParticles(c,scr){
  for(const p of PS){if(!!p.s!==scr)continue;const a=clamp(p.life/p.max,0,1);
    if(p.k==='foam'){c.fillStyle=`rgba(255,255,255,${.85*a})`;circ(c,p.x,p.y,p.r);c.strokeStyle=`rgba(150,200,220,${.6*a})`;c.lineWidth=1;c.beginPath();c.arc(p.x,p.y,p.r,0,TAU);c.stroke();}
    else if(p.k==='mud'){c.fillStyle=`rgba(40,28,16,${a})`;circ(c,p.x,p.y,p.r);}
    else if(p.k==='steam'){c.fillStyle=`rgba(255,255,255,${.35*a})`;circ(c,p.x,p.y,p.r);}
    else if(p.k==='chip'){c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.fillStyle='#e9dfbd';c.strokeStyle='#5e4a2a';c.lineWidth=1.5;c.beginPath();c.moveTo(-p.r,0);c.quadraticCurveTo(0,-6,p.r,0);c.quadraticCurveTo(0,-2,-p.r,0);c.fill();c.stroke();c.restore();}
    else if(p.k==='spark'){c.fillStyle=p.c;c.globalAlpha=a;c.beginPath();for(let k=0;k<8;k++){const r=k%2?p.r*.4:p.r,an=k*Math.PI/4;c.lineTo(p.x+Math.cos(an)*r,p.y+Math.sin(an)*r);}c.fill();c.globalAlpha=1;}
    else if(p.k==='drop'){c.globalAlpha=a;c.fillStyle=p.c;circ(c,p.x,p.y,p.r);c.globalAlpha=1;}
    else if(p.k==='hair'){c.save();c.globalAlpha=a;c.translate(p.x,p.y);c.rotate(p.rot);c.strokeStyle='#3a2a18';c.lineWidth=1.3;c.beginPath();c.moveTo(-p.r/2,0);c.quadraticCurveTo(0,-3,p.r/2,0);c.stroke();c.restore();}
    else if(p.k==='curl'){c.globalAlpha=Math.min(1,a*2);drawCurl(c,p.x,p.y,p.r,p.rot);c.globalAlpha=1;}
    else if(p.k==='heart'){c.globalAlpha=a;c.fillStyle='#f06292';c.font=`${p.r*1.6}px sans-serif`;c.textAlign='center';c.fillText('♥',p.x,p.y);c.globalAlpha=1;}
  }
  for(const f of FT){if(f.s!==scr)continue;const a=clamp(f.life/f.max*1.6,0,1),age=f.max-f.life,pz=age<.18?.6+.4*(1-Math.pow(1-age/.18,3))*1.12:age<.28?1.12-.12*(age-.18)/.1:1;c.globalAlpha=a;c.font=`${Math.round(f.size*pz)}px ${DISPLAY}`;c.textAlign='center';c.lineWidth=4;c.lineJoin='round';c.strokeStyle='rgba(30,20,10,.85)';c.strokeText(f.t,f.x,f.y);c.fillStyle=f.c;c.fillText(f.t,f.x,f.y);c.globalAlpha=1;}
}
function draw(t){
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
  if(!C||!IMG.chair)return;
  let sx=0,sy=0;if(shake>0){sx=(Math.random()-.5)*8*shake/.3;sy=(Math.random()-.5)*6*shake/.3;}
  ctx.setTransform(dpr*sc,0,0,dpr*sc,dpr*(ox+sx*sc),dpr*(oy+sy*sc));
  const e=ease(entry);
  drawScene(ctx,t);drawImg(ctx,chairImg(),ART.chair);drawDecor(ctx,t);
  ctx.save();ctx.translate(face==='shiver'?Math.sin(t*50)*1.5:0,(1-e)*-340);drawFrog(ctx,t);ctx.restore();
  drawDaylight(ctx);
  ctx.save();ctx.translate(FO.x,(1-e)*340+R.jy*.12+FO.y);
  if(bucket>.01)drawBucketBack(ctx,bucket);
  drawFoot(ctx,t);
  if(bucket>.01)drawBucketFront(ctx,bucket,t);
  if(M&&M.type==='massage')drawMassage(ctx,t);
  if(M&&M.type==='paint')drawPaintHints(ctx,t);
  if(M&&SVC[M.type])SVC[M.type].draw(ctx,t);
  if(M&&M.type==='peel'&&ptrF){if(peeling)drawCurl(ctx,M.curl.x,M.curl.y,M.curl.s,0);drawBlade(ctx,ptrF[0],ptrF[1]);}
  if(M&&M.type==='scrub'&&ptrF){const r=15+S.up.brush*5;ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=2;ctx.setLineDash([3,4]);ctx.beginPath();ctx.arc(ptrF[0],ptrF[1],r,0,TAU);ctx.stroke();ctx.setLineDash([]);}
  if(C.boss)bmDrawFoot(ctx,t);
  drawParticles(ctx,false);
  ctx.restore();
  if(C.boss)bmDrawUI(ctx,t);
  if(M&&M.type==='soak')drawThermo(ctx);
  if(M&&M.type==='scrub'&&C.tickles.length)drawTickleMeter(ctx);
  if(Q)drawQTE(ctx,t);
  drawParticles(ctx,true);
}

let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt,now/1000);draw(now/1000);coachTick();requestAnimationFrame(loop);}

/* ---------- boot ---------- */
try{document.fonts&&document.fonts.load("20px 'ZCOOL KuaiLe'");}catch(e){}
setMuteIcon();hud();requestAnimationFrame(loop);loadArt().then(()=>{setChapter();buildMask();dayGoal=goalFor(S.day);seat(makeSpec());entry=1;showTitle();});
})();
</script>

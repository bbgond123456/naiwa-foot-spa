<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one-screen phone column on bathhouse tiles — neon shop sign, paper service ticket, canvas stage, wooden tool tray */
:root{
  --tile:#3a8a7f; --tile-line:#2f7268; --deep:#163a35;
  --wood:#c08447; --wood-dark:#6f4220; --wood-light:#e4b57c;
  --sign:#c4302a; --gold:#f5c95c; --paper:#fbf4e4; --paper-line:#e2d3b4;
  --ink:#2b2118; --ink-soft:#6b5a48;
  --good:#3f9d4a; --warn:#e08a1e; --bad:#c4302a;
  --display:'ZCOOL KuaiLe','Hiragino Sans GB','PingFang SC','Microsoft YaHei',sans-serif;
  --body:'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;
  color-scheme: light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--deep);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-color:var(--tile);
  background-image:linear-gradient(var(--tile-line) 2px,transparent 2px),linear-gradient(90deg,var(--tile-line) 2px,transparent 2px);
  background-size:34px 34px;background-position:-1px -1px}

/* header */
.top{display:flex;align-items:center;gap:8px}
.sign{background:var(--sign);color:var(--gold);font-family:var(--display);font-size:22px;letter-spacing:.08em;padding:3px 12px 4px;border-radius:8px;
  border:2px solid var(--gold);box-shadow:0 0 0 3px var(--sign),0 0 14px rgba(245,201,92,.45);text-shadow:0 0 6px rgba(245,201,92,.7);white-space:nowrap}
.stats{margin-left:auto;display:flex;gap:6px;align-items:center}
.chip{background:rgba(22,58,53,.75);color:var(--paper);padding:4px 10px;border-radius:999px;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.coin{background:var(--gold);color:var(--ink);font-weight:700}
.chip.coin.pop{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.25)}}
.icon-btn{width:32px;height:32px;border-radius:50%;border:0;background:rgba(22,58,53,.75);color:var(--paper);display:grid;place-items:center;flex:none}

/* ticket */
.ticket{background:var(--paper);border-radius:4px 4px 10px 10px;padding:8px 12px 10px;box-shadow:0 3px 0 rgba(0,0,0,.18);position:relative;display:flex;flex-direction:column;gap:6px}
.ticket::before{content:"";position:absolute;left:0;right:0;top:-5px;height:6px;background:radial-gradient(circle at 5px 0,transparent 4px,var(--paper) 4.5px) 0 0/10px 6px repeat-x}
.t-head{display:flex;align-items:baseline;gap:8px}
.tag{font-size:11px;background:var(--wood-dark);color:var(--paper);padding:1px 6px;border-radius:3px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.t-head b{font-family:var(--display);font-size:19px;font-weight:400}
.kind{font-family:var(--body);font-size:12px;color:var(--ink-soft);margin-left:6px;font-weight:400}
.t-count{margin-left:auto;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.quote{margin:0;font-size:14px;color:var(--ink);min-height:1.4em;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.st{font-size:12px;padding:2px 8px;border-radius:999px;border:1.5px dashed var(--paper-line);color:var(--ink-soft);display:inline-flex;align-items:center;gap:4px}
.st.cur{border-style:solid;border-color:var(--sign);color:var(--sign);font-weight:700}
.st.done{background:var(--good);border-color:var(--good);color:#fff;border-style:solid}
.st i{width:9px;height:9px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.25)}
.pat{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-soft)}
.bar{flex:1;height:8px;background:var(--paper-line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--good);border-radius:4px;transition:background .3s}

/* stage */
.stage{flex:1;min-height:0;position:relative}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.instr{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);background:rgba(22,40,36,.82);color:var(--paper);padding:6px 14px 7px;border-radius:12px;font-size:13px;
  text-align:center;width:max-content;max-width:94%;pointer-events:none;display:flex;flex-direction:column;gap:5px;line-height:1.35}
.instr.flash{animation:shk .35s}
@keyframes shk{25%{transform:translateX(calc(-50% - 6px))}75%{transform:translateX(calc(-50% + 6px))}}
.prog{height:6px;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--gold)}
.swatches{position:absolute;top:4px;right:0;display:flex;flex-direction:column;gap:6px}
.sw{display:flex;align-items:center;gap:6px;background:var(--paper);border:2px solid transparent;border-radius:999px;padding:3px 10px 3px 4px;font-size:12px;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.sw span{width:20px;height:20px;border-radius:50%;border:1.5px solid rgba(0,0,0,.25)}
.sw.sel{border-color:var(--sign);font-weight:700}

/* tray */
.tray{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;background:var(--wood-dark);padding:6px;border-radius:12px;box-shadow:inset 0 2px 0 rgba(255,255,255,.12)}
.tool{border:0;border-radius:9px;background:linear-gradient(var(--wood-light),var(--wood));box-shadow:0 3px 0 #4d2c12;padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;color:var(--ink)}
.tool svg{width:30px;height:30px}
.tool small{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tool:active{transform:translateY(2px);box-shadow:0 1px 0 #4d2c12}
.tool.active{background:linear-gradient(#fff3c8,var(--gold));box-shadow:0 0 0 2px var(--paper),0 3px 0 #4d2c12}
.tool.hint{animation:glow 1s infinite}
.tool.no{animation:no .3s}
@keyframes glow{50%{box-shadow:0 0 0 3px var(--gold),0 3px 0 #4d2c12}}
@keyframes no{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(12,32,29,.72);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.panel{background:var(--paper);color:var(--ink);border-radius:14px;width:100%;max-width:380px;max-height:100%;overflow:auto;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.panel h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0;text-wrap:balance}
.panel p{margin:0;line-height:1.6;font-size:14px}
.muted{color:var(--ink-soft);font-size:13px}
.bigsign{background:var(--sign);border-radius:14px;padding:14px 10px 12px;text-align:center;border:3px solid var(--gold);
  box-shadow:inset 0 0 0 5px var(--sign),inset 0 0 0 7px rgba(245,201,92,.55),0 0 22px rgba(196,48,42,.4)}
.bigsign b{display:block;font-family:var(--display);font-weight:400;color:var(--gold);font-size:46px;letter-spacing:.12em;text-shadow:0 0 10px rgba(245,201,92,.8);line-height:1.1}
.bigsign span{color:var(--paper);font-size:13px;letter-spacing:.3em}
.menu{border:1.5px solid var(--paper-line);border-radius:8px;padding:8px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px;font-variant-numeric:tabular-nums}
.menu .h{grid-column:1/-1;font-family:var(--display);font-size:16px;color:var(--sign)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;border:0;border-radius:10px;padding:11px 14px;font-family:var(--display);font-size:18px;background:var(--sign);color:var(--paper);box-shadow:0 3px 0 #7d1d18;min-width:120px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #7d1d18}
.btn.ghost{background:transparent;color:var(--ink-soft);box-shadow:none;border:1.5px solid var(--paper-line);font-family:var(--body);font-size:13px;flex:0 1 auto}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.receipt{font-variant-numeric:tabular-nums;display:flex;flex-direction:column;gap:6px;font-size:14px;border-top:1.5px dashed var(--paper-line);border-bottom:1.5px dashed var(--paper-line);padding:10px 0}
.row{display:flex;gap:8px;align-items:baseline}
.row .dots{flex:1;border-bottom:1.5px dotted var(--paper-line);transform:translateY(-4px)}
.row.total{font-family:var(--display);font-size:22px;color:var(--sign)}
.row .x{color:var(--ink-soft);font-size:12px}
.stars{font-size:26px;color:var(--gold);letter-spacing:4px;text-shadow:0 1px 0 var(--wood-dark)}
.say{background:#fff;border-radius:12px;padding:8px 12px;font-size:14px;position:relative;border:1.5px solid var(--paper-line)}
.shop{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;border:1.5px solid var(--paper-line);border-radius:10px;padding:8px 10px}
.item b{font-size:15px}
.item .d{font-size:12px;color:var(--ink-soft);grid-column:1}
.pips{display:flex;gap:3px;grid-column:1}
.pips i{width:14px;height:5px;border-radius:2px;background:var(--paper-line)}
.pips i.on{background:var(--good)}
.buy{grid-row:1/4;grid-column:2;border:0;border-radius:8px;padding:8px 10px;background:var(--gold);font-weight:700;font-variant-numeric:tabular-nums;box-shadow:0 2px 0 var(--wood-dark);min-width:68px}
.buy[disabled]{background:var(--paper-line);color:var(--ink-soft);box-shadow:none;cursor:not-allowed}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <header class="top">
    <div class="sign">奶蛙足道</div>
    <div class="stats">
      <div class="chip" id="dayChip">第1天</div>
      <div class="chip coin" id="coinChip">¥0</div>
      <button class="icon-btn" id="menuBtn" aria-label="菜单">

</div>

<div class="overlay" id="ov" hidden><div class="panel" id="panel"></div></div>

/* ---------- audio ---------- */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f1,f2,dur,type,vol,delay){const a=AC;if(!a||S.muted||a.state!=='running')return;const t=a.currentTime+(delay||0);const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.03);}
function noise(dur,vol,freq){const a=AC;if(!a||S.muted||a.state!=='running')return;const b=a.createBuffer(1,Math.floor(a.sampleRate*dur),a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;const g=a.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(a.destination);s.start();}

const MK=document.createElement('canvas');MK.width=W;MK.height=H;const mkc=MK.getContext('2d');

function webPath(c,g){
  c.beginPath();c.moveTo(BASES[0][0]-14-g,BASES[0][1]+14);c.lineTo(TIPS[0][0]-6-g,TIPS[0][1]+4);
  for(let i=0;i<4;i++){const a=TIPS[i],b=TIPS[i+1];const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;c.quadraticCurveTo(mx,my+(300-my)*.5-g*1.5,b[0],b[1]);}
  c.lineTo(TIPS[4][0]+6+g,TIPS[4][1]+4);c.lineTo(BASES[4][0]+14+g,BASES[4][1]+14);c.closePath();
}
function footShape(c,g,web){
  const base=c.fillStyle;
  if(web)c.fillStyle=web;webPath(c,g);c.fill();c.fillStyle=base;
  c.beginPath();c.ellipse(180,350,88+g,74+g,0,0,TAU);c.fill();
  c.beginPath();c.ellipse(180,420,68+g,54+g,0,0,TAU);c.fill();
  c.lineCap='round';c.lineWidth=28+2*g;c.strokeStyle=base;
  for(let i=0;i<5;i++){c.beginPath();c.moveTo(BASES[i][0],BASES[i][1]);c.lineTo(TIPS[i][0],TIPS[i][1]);c.stroke();}
  for(let i=0;i<5;i++){c.beginPath();c.arc(TIPS[i][0],TIPS[i][1],20+g,0,TAU);c.fill();}
}

const onFoot=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&maskData[((y|0)*W+(x|0))*4+3]>0;

function buildDirt(){
  dc.setTransform(1,0,0,1,0,0);dc.globalCompositeOperation='source-over';dc.clearRect(0,0,D.width,D.height);
  dc.setTransform(DS,0,0,DS,0,0);drawImg(dc,IMG.fdirt,ART.foot);
  dirtInit=Math.max(1,countDirt());fadeDirt=0;
}
function countDirt(){smc.clearRect(0,0,90,120);smc.drawImage(D,0,0,90,120);const d=smc.getImageData(0,0,90,120).data;let n=0;for(let i=3;i<d.length;i+=4)if(d[i]>60)n++;return n;}
function scrubAt(x0,y0,x1,y1){
  const r=15+S.up.brush*5;
  dc.setTransform(DS,0,0,DS,0,0);dc.globalCompositeOperation='destination-out';
  const dist=Math.hypot(x1-x0,y1-y0),n=Math.max(1,Math.ceil(dist/(r*.4)));
  for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n,y=y0+(y1-y0)*i/n;const g=dc.createRadialGradient(x,y,r*.25,x,y,r);g.addColorStop(0,'rgba(0,0,0,.2)');g.addColorStop(1,'rgba(0,0,0,0)');dc.fillStyle=g;dc.beginPath();dc.arc(x,y,r,0,TAU);dc.fill();}
  dc.globalCompositeOperation='source-over';
}

function useTool(id,btn){
  ac();
  if(paused||!C||C.done||entry<1)return;
  if(M){flashInstr('先把手上这一步做完');return;}
  if(id==='towel'){
    if(C.si<C.steps.length&&!towelArm){towelArm=true;flashInstr('还有项目没做，再点一次毛巾直接结账');setTimeout(()=>towelArm=false,2600);return;}
    towelArm=false;checkout(false);return;
  }
  if(C.si>=C.steps.length){say('都弄完啦，擦干结账吧～');hintTool('towel');return;}
  const need=C.steps[C.si];
  if(id===need){startMini(id);return;}
  C.pat-=8;wrongCount++;setFace('angry',1.2);shake=.3;sfx.bad();
  say(id==='paint'&&!C.paint?'我没说要美甲啊！':pick(LINES.wrong));
  if(btn){btn.classList.remove('no');void btn.offsetWidth;btn.classList.add('no');}
  if(wrongCount>=2){flashInstr(`提示：下一步是「${STEPS[need].n}」`);hintTool(need);}else flashInstr('工具不对，客人不高兴了');
}

function startMini(t){

  if(t==='massage'){const n=5+(S.day>3?1:0);const seq=POINTS.slice().sort(()=>Math.random()-.5).slice(0,n);M={type:'massage',seq,k:0,r:56,wait:.6,score:0,spd:44/clamp(1.3-S.day*.03,.85,1.3)};setInstr('光圈缩到金色圈上时，点那个穴位');}

function finish(step,q){

/* ---------- geometry helpers ---------- */
function toeDir(i){const t=TIPS[i],b=BASES[i],dx=t[0]-b[0],dy=t[1]-b[1],l=Math.hypot(dx,dy);return[dx/l,dy/l];}
function clawMid(i){const n=C.nails[i],[dx,dy]=toeDir(i),t=TIPS[i];return[t[0]+dx*(8+n.len*.6),t[1]+dy*(8+n.len*.6)];}

/* ---------- interactions ---------- */
function ptOf(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left-ox)/sc,(e.clientY-r.top-oy)/sc];}
cv.addEventListener('pointerdown',e=>{
  ac();if(paused||!C||C.done||!M)return;
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  ptr=ptOf(e);const [x,y]=toFoot(ptr[0],ptr[1]);ptrF=[x,y];
  if(M.type==='soak')hold=true;
  else if(M.type==='scrub'){scrubbing=true;lastP=[x,y];scrubAt(x,y,x,y);M.dirty=true;}
  else if(M.type==='trim')tryClip(x,y);
  else if(M.type==='massage')tryPress(x,y);
  else if(M.type==='paint')tryPaint(x,y);
});
cv.addEventListener('pointermove',e=>{
  ptr=ptOf(e);const p=toFoot(ptr[0],ptr[1]);ptrF=p;
  if(scrubbing&&M&&M.type==='scrub'){
    scrubAt(lastP[0],lastP[1],p[0],p[1]);M.dirty=true;
    const moved=Math.hypot(p[0]-lastP[0],p[1]-lastP[1]);
    if(moved>2&&onFoot(p[0],p[1])){
      if(Math.random()<.6)PS.push({k:'foam',x:p[0]+(Math.random()-.5)*20,y:p[1]+(Math.random()-.5)*20,vx:(Math.random()-.5)*20,vy:-10-Math.random()*20,life:.9,max:.9,r:3+Math.random()*6});
      if(Math.random()<.25&&M.clean<.85)PS.push({k:'mud',x:p[0],y:p[1],vx:(Math.random()-.5)*60,vy:-20,life:1,max:1,r:1.5+Math.random()*2.5});
      setFace('tickle',.35);if(Math.random()<.05)addFT('哈',110+Math.random()*160,60+Math.random()*40,'#ffffff',16,1);
      if(bubT<=0){sfx.bubble();bubT=.11;}
      if(tickleT<=0){say(pick(LINES.tickle));tickleT=5;}
    }
    lastP=p;
  }
});
const release=()=>{hold=false;scrubbing=false;};
cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',release);cv.addEventListener('pointerleave',()=>{release();ptr=null;ptrF=null;});
window.addEventListener('keydown',e=>{if(e.code==='Space'&&M&&M.type==='soak'&&!paused){hold=true;e.preventDefault();}});
window.addEventListener('keyup',e=>{if(e.code==='Space')hold=false;});

function tryClip(x,y){
  const rad=18+S.up.clip*6;let best=-1,bd=1e9;
  C.nails.forEach((n,i)=>{if(!n.long||n.clipped)return;const [mx,my]=clawMid(i);const d=Math.hypot(x-mx,y-my);if(d<bd){bd=d;best=i;}});
  if(best>=0&&bd<rad){
    const n=C.nails[best];n.clipped=true;const [mx,my]=clawMid(best);sfx.clip();
    PS.push({k:'chip',x:mx,y:my,vx:(Math.random()-.5)*160,vy:-120-Math.random()*60,life:1.1,max:1.1,r:n.len*.5,rot:0,vr:(Math.random()-.5)*14});
    addFT('咔嚓',mx,my-14,'#ffffff',18);
    const left=C.nails.filter(n=>n.long&&!n.clipped).length,tot=C.nails.filter(n=>n.long).length;
    progress(1-left/tot);
    if(!left)finish('trim',Math.max(.3,1-.15*M.miss));
  }else if(onFoot(x,y)){
    M.miss++;C.pat-=6;setFace('ouch',1);say(pick(LINES.ouch));sfx.bad();shake=.35;addFT('夹到肉',x,y-10,'#ff8a80',18);
  }
}
function tryPress(x,y){
  if(M.wait>0)return;
  const p=M.seq[M.k];if(Math.hypot(x-p.x,y-p.y)>36)return;
  const e=Math.abs(M.r-16);
  if(e<=6){M.score+=2;addFT(p.n+' · 完美',p.x,p.y-30,'#f5c95c',17);sfx.perfect();setFace('bliss',1.1);
    for(let i=0;i<4;i++)PS.push({k:'heart',x:p.x,y:p.y,vx:(Math.random()-.5)*60,vy:-40-Math.random()*40,life:1,max:1,r:10});
    if(Math.random()<.4)say(pick(LINES.bliss));}
  else if(e<=14){M.score+=1;addFT(p.n+' · 不错',p.x,p.y-30,'#ffffff',16);sfx.tap();setFace('happy',.8);}
  else{C.pat-=4;addFT('按偏了',p.x,p.y-30,'#ff8a80',16);sfx.bad();setFace('ouch',.6);}
  nextPoint();
}
function nextPoint(){M.k++;M.r=56;M.wait=.35;progress(M.k/M.seq.length);if(M.k>=M.seq.length)finish('massage',Math.max(.3,M.score/(2*M.seq.length)));}
function tryPaint(x,y){
  let best=-1,bd=1e9;TIPS.forEach((t,i)=>{const d=Math.hypot(x-t[0],y-t[1]);if(d<bd){bd=d;best=i;}});
  if(bd>28)return;
  if(!M.color){flashInstr('先在右上角选一个颜色');return;}
  const n=C.nails[best];if(n.paint===C.paint.c)return;
  n.paint=M.color.c;
  const t=TIPS[best];
  for(let i=0;i<6;i++)PS.push({k:'spark',x:t[0],y:t[1]-10,vx:(Math.random()-.5)*90,vy:-30-Math.random()*60,life:.7,max:.7,r:4,c:M.color.c});
  if(M.color!==C.paint){M.wrong++;C.pat-=5;setFace('angry',1);say(`我要的是${C.paint.n}！`);sfx.bad();}
  else sfx.tap();
  const ok=C.nails.filter(n=>n.paint===C.paint.c).length;progress(ok/TIPS.length);
  if(ok===TIPS.length)finish('paint',Math.max(.3,1-.15*M.wrong));
}
function addFT(t,x,y,c,size,s){FT.push({t,x,y,c,size,s:!!s,life:1.1,max:1.1});}

/* ---------- checkout / flow ---------- */
function checkout(angry){
  if(!C||C.done)return;
  C.done=true;M=null;hold=false;scrubbing=false;$('swatches').hidden=true;updateTray();
  const k=1+.12*S.up.deco;
  const rows=C.steps.map(s=>({s,q:C.q[s],amt:C.q[s]!=null?Math.round(STEPS[s].p*C.q[s]*k):0}));
  let sum=rows.reduce((a,r)=>a+r.amt,0);
  const undone=rows.filter(r=>r.q==null).length;
  const avg=rows.reduce((a,r)=>a+(r.q||0),0)/rows.length;
  const stars=angry?1:clamp(Math.round(avg*3.2+C.pat/100*1.8),1,5);
  let tip=0,cut=0;
  if(angry){cut=sum-Math.round(sum*.5);sum-=cut;}
  else if(!undone)tip=Math.round(sum*.3*(C.pat/100)*(1+.15*S.up.aroma)*(stars>=4?1:.5));
  const total=sum+tip;
  S.coins+=total;dayEarn+=total;dayStars.push(stars);S.served++;save();hud();popCoin();
  if(total>0)setTimeout(()=>sfx.coin(),150);
  if(!angry){setFace(undone?'angry':'bliss',99);}
  const line=angry?'不洗了！再也不来了！':undone?'怎么没弄完就让我走？':pick(LINES.done);
  setTimeout(()=>showReceipt(rows,tip,cut,total,stars,line,angry),angry?500:350);
}
function showReceipt(rows,tip,cut,total,stars,line,angry){
  const last=custIdx+1>=dayCount();
  const rr=rows.map(r=>`<div class="row"><span>${STEPS[r.s].n}${r.q!=null&&r.q<.99?` <span class="x">×${Math.round(r.q*100)}%</span>`:''}</span><span class="dots"></span><span>${r.q==null?'<span class="x">未做</span>':'¥'+r.amt}</span></div>`).join('');
  open(`<h2>${C.name} 的账单</h2>
  <div class="stars" aria-label="${stars} 星">${'★'.repeat(stars)}${'☆'.repeat(5-stars)}</div>
  <div class="say">「${line}」</div>
  <div class="receipt">${rr}
    ${tip?`<div class="row"><span>小费</span><span class="dots"></span><span>¥${tip}</span></div>`:''}
    ${angry?`<div class="row"><span>气走了，只付一半</span><span class="dots"></span><span>−¥${cut}</span></div>`:''}
    <div class="row total"><span>实收</span><span class="dots"></span><span>¥${total}</span></div>
  </div>
  <div class="btns"><button class="btn" id="nextBtn">${last?'打烊盘点':'下一位客人'}</button></div>`);
  $('nextBtn').onclick=()=>{custIdx++;if(custIdx<dayCount()){close();newCustomer();}else showDayEnd();};
}
function showDayEnd(){
  const avg=dayStars.length?(dayStars.reduce((a,b)=>a+b,0)/dayStars.length):0;
  const comment=avg>=4.5?'荷塘里都在传你的手艺。':avg>=3.5?'口碑不错，明天客人会更多。':avg>=2.5?'还行，有几位客人皱着眉走的。':'今天有点砸招牌…';
  S.day++;save();
  open(`<h2>第 ${S.day-1} 天打烊</h2>
  <div class="receipt">
    <div class="row"><span>服务客人</span><span class="dots"></span><span>${dayStars.length} 位</span></div>
    <div class="row"><span>平均评分</span><span class="dots"></span><span>★ ${avg.toFixed(1)}</span></div>
    <div class="row total"><span>今日营业额</span><span class="dots"></span><span>¥${dayEarn}</span></div>
  </div>
  <p>${comment}</p>
  <div class="btns"><button class="btn" id="shopBtn">去采购升级</button></div>`);
  $('shopBtn').onclick=showShop;
}
function showShop(){
  const items=UPG.map(u=>{const lv=S.up[u.id],max=lv>=u.max,cost=upCost(u,lv);
    return `<div class="item"><b>${u.n}</b><button class="buy" data-u="${u.id}" ${max||S.coins<cost?'disabled':''}>${max?'已满级':'¥'+cost}</button>
    <span class="d">${u.d}</span><div class="pips">${Array.from({length:u.max},(_,i)=>`<i class="${i<lv?'on':''}"></i>`).join('')}</div></div>`;}).join('');
  open(`<h2>采购升级</h2><p class="muted">钱包 <b style="color:var(--sign);font-size:16px">¥${S.coins}</b> · 明天要接待 ${dayCount()} 位客人</p>

/* ---------- update ---------- */
function update(dt,t){
  if(!C)return;
  react(dt,t);
  entry=Math.min(1,entry+dt*1.8);
  const bt=M&&M.type==='soak'?1:0;bucket+=(bt-bucket)*Math.min(1,dt*6);
  bubT-=dt;tickleT-=dt;shake=Math.max(0,shake-dt);
  if(fadeDirt>0){fadeDirt-=dt*2;if(fadeDirt<=0){fadeDirt=0;dc.setTransform(1,0,0,1,0,0);dc.clearRect(0,0,D.width,D.height);}}
  if(faceT>0&&faceT<90){faceT-=dt;if(faceT<=0)face=baseFace();}
  if(!paused&&!C.done&&entry>=1){
    C.pat-=dt*(1+S.day*.08)*(1-.12*S.up.aroma)*.95*C.kind.pat;
    if(C.pat<40){rushT-=dt;if(rushT<=0){rushT=9;say(pick(LINES.rush));}}
    if(C.pat<=0){C.pat=0;setFace('angry',99);sfx.bad();checkout(true);}
    if(faceT<=0&&face!==baseFace())face=baseFace();
  }
  if(M&&!paused){
    if(M.type==='soak'){
      const lo=39-S.up.kettle*.8,hi=44+S.up.kettle*.8;
      M.T=clamp(M.T+(hold?15:-7)*dt,22,58);
      if(M.T>=lo&&M.T<=hi){M.prog+=dt;setFace('bliss',.25);if(!M.saidB){M.saidB=true;say(pick(LINES.bliss));}}
      else if(M.T>hi+3){M.over+=dt;C.pat-=9*dt;setFace('hot',.25);shake=.12;if(Math.random()<dt*10)PS.push({k:'steam',s:1,x:160+Math.random()*60,y:60,vx:(Math.random()-.5)*20,vy:-40,life:1,max:1,r:5});M.hotT-=dt;if(M.hotT<=0){M.hotT=2.5;say(pick(LINES.hot));}}
      else if(M.T<lo-6){setFace('shiver',.25);if(!M.saidC){M.saidC=true;say(pick(LINES.cold));}}
      if(Math.random()<dt*(M.T-20)*.5){const top=BT0-BTR*ease(bucket);PS.push({k:'steam',x:BX-100+Math.random()*200,y:top-4,vx:(Math.random()-.5)*10,vy:-25-Math.random()*20,life:1.6,max:1.6,r:6+Math.random()*6});}
      progress(M.prog/M.need);
      if(M.prog>=M.need)finish('soak',clamp(1-M.over*.2,.4,1));
    }else if(M.type==='scrub'){
      M.mt-=dt;
      if(M.dirty&&M.mt<=0){M.mt=.18;M.dirty=false;M.clean=1-countDirt()/dirtInit;progress(M.clean/.93);if(M.clean>=.93)finish('scrub',1);}
    }else if(M.type==='massage'){

      else{M.r-=M.spd*dt;if(M.r<=0){const p=M.seq[M.k];C.pat-=4;addFT('错过了',p.x,p.y-30,'#ff8a80',16);setFace('neutral',.5);nextPoint();}}
    }
  }
  for(let i=PS.length-1;i>=0;i--){const p=PS[i];p.life-=dt;if(p.life<=0){PS.splice(i,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.k==='mud'||p.k==='chip')p.vy+=420*dt;if(p.k==='spark')p.vy+=200*dt;if(p.k==='steam')p.r+=8*dt;if(p.rot!=null)p.rot+=p.vr*dt;}
  for(let i=FT.length-1;i>=0;i--){const f=FT[i];f.life-=dt;f.y-=28*dt;if(f.life<=0)FT.splice(i,1);}
  const pb=$('patBar');const pv=clamp(C.pat,0,100);pb.style.width=pv+'%';pb.style.background=pv>60?'var(--good)':pv>30?'var(--warn)':'var(--bad)';
}

  for(let i=1;i<8;i++){const x0=BX-BW-6+i*(2*BW+12)/8,x1=BX-BW+10+i*(2*BW-20)/8;c.beginPath();c.moveTo(x0,top+14);c.lineTo(x1,top+170);c.stroke();}
  c.fillStyle='#4a4f55';[30,86].forEach(o=>{c.fillRect(BX-BW-4+o*.1,top+o,2*BW+8-o*.2,6);});
  c.strokeStyle='#6f4220';c.lineWidth=7;c.beginPath();c.ellipse(BX,top,BW+6,15,0,0,Math.PI);c.stroke();
}
function drawThermo(c){
  const x=336,y0=160,y1=340,lo=39-S.up.kettle*.8,hi=44+S.up.kettle*.8;
  const ty=T=>y1-(T-22)/36*(y1-y0);
  c.fillStyle='rgba(255,255,255,.92)';c.strokeStyle='#2b2118';c.lineWidth=2;
  c.beginPath();c.roundRect(x-9,y0-8,18,y1-y0+16,9);c.fill();c.stroke();
  c.fillStyle='rgba(63,157,74,.45)';c.fillRect(x-7,ty(hi),14,ty(lo)-ty(hi));
  const T=M.T,col=T>hi+3?'#c4302a':T<lo-6?'#4b6fd6':'#e0612a';
  c.fillStyle=col;c.fillRect(x-4,ty(T),8,y1+8-ty(T));circ(c,x,y1+16,12);c.stroke();
  c.font=`14px ${DISPLAY}`;c.textAlign='center';c.lineWidth=3;c.strokeStyle='rgba(20,40,36,.85)';
  const s=Math.round(T)+'°';c.strokeText(s,x,y0-16);c.fillStyle='#fff';c.fillText(s,x,y0-16);
}
function drawMassage(c,t){
  if(M.wait>0||M.k>=M.seq.length)return;
  const p=M.seq[M.k];
  c.fillStyle='rgba(196,48,42,.85)';circ(c,p.x,p.y,6);
  c.strokeStyle='#f5c95c';c.lineWidth=3;c.beginPath();c.arc(p.x,p.y,16,0,TAU);c.stroke();
  c.strokeStyle='rgba(255,255,255,.95)';c.lineWidth=3.5;c.beginPath();c.arc(p.x,p.y,Math.max(1,M.r),0,TAU);c.stroke();
  c.font=`14px ${DISPLAY}`;c.textAlign='center';c.lineWidth=3;c.strokeStyle='rgba(30,20,10,.8)';c.strokeText(p.n,p.x,p.y-M.r-8);c.fillStyle='#fff';c.fillText(p.n,p.x,p.y-M.r-8);
}
function drawPaintHints(c,t){
  TIPS.forEach((tp,i)=>{if(C.nails[i].paint===C.paint.c)return;c.strokeStyle=`rgba(255,255,255,${.5+.4*Math.sin(t*5+i)})`;c.lineWidth=2;c.setLineDash([5,4]);c.beginPath();c.arc(tp[0],tp[1],22,0,TAU);c.stroke();c.setLineDash([]);});
}
function drawParticles(c,scr){
  for(const p of PS){if(!!p.s!==scr)continue;const a=clamp(p.life/p.max,0,1);
    if(p.k==='foam'){c.fillStyle=`rgba(255,255,255,${.85*a})`;circ(c,p.x,p.y,p.r);c.strokeStyle=`rgba(150,200,220,${.6*a})`;c.lineWidth=1;c.beginPath();c.arc(p.x,p.y,p.r,0,TAU);c.stroke();}
    else if(p.k==='mud'){c.fillStyle=`rgba(40,28,16,${a})`;circ(c,p.x,p.y,p.r);}
    else if(p.k==='steam'){c.fillStyle=`rgba(255,255,255,${.35*a})`;circ(c,p.x,p.y,p.r);}
    else if(p.k==='chip'){c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.fillStyle='#e9dfbd';c.strokeStyle='#5e4a2a';c.lineWidth=1.5;c.beginPath();c.moveTo(-p.r,0);c.quadraticCurveTo(0,-6,p.r,0);c.quadraticCurveTo(0,-2,-p.r,0);c.fill();c.stroke();c.restore();}
    else if(p.k==='spark'){c.fillStyle=p.c;c.globalAlpha=a;c.beginPath();for(let k=0;k<8;k++){const r=k%2?p.r*.4:p.r,an=k*Math.PI/4;c.lineTo(p.x+Math.cos(an)*r,p.y+Math.sin(an)*r);}c.fill();c.globalAlpha=1;}
    else if(p.k==='heart'){c.globalAlpha=a;c.fillStyle='#f06292';c.font=`${p.r*1.6}px sans-serif`;c.textAlign='center';c.fillText('♥',p.x,p.y);c.globalAlpha=1;}
  }
  for(const f of FT){if(f.s!==scr)continue;const a=clamp(f.life/f.max*1.6,0,1);c.globalAlpha=a;c.font=`${f.size}px ${DISPLAY}`;c.textAlign='center';c.lineWidth=4;c.lineJoin='round';c.strokeStyle='rgba(30,20,10,.85)';c.strokeText(f.t,f.x,f.y);c.fillStyle=f.c;c.fillText(f.t,f.x,f.y);c.globalAlpha=1;}
}
function draw(t){
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
  if(!C||!IMG.chair)return;
  let sx=0,sy=0;if(shake>0){sx=(Math.random()-.5)*8*shake/.3;sy=(Math.random()-.5)*6*shake/.3;}
  ctx.setTransform(dpr*sc,0,0,dpr*sc,dpr*(ox+sx*sc),dpr*(oy+sy*sc));
  const e=ease(entry);
  drawImg(ctx,IMG.chair,ART.chair);
  ctx.save();ctx.translate(face==='shiver'?Math.sin(t*50)*1.5:0,(1-e)*-340);drawFrog(ctx,t);ctx.restore();
  ctx.save();ctx.translate(0,(1-e)*340+R.jy*.12);
  if(bucket>.01)drawBucketBack(ctx,bucket);
  drawFoot(ctx,t);
  if(bucket>.01)drawBucketFront(ctx,bucket,t);
  if(M&&M.type==='massage')drawMassage(ctx,t);
  if(M&&M.type==='paint')drawPaintHints(ctx,t);
  if(M&&M.type==='scrub'&&ptrF){const r=15+S.up.brush*5;ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=2;ctx.setLineDash([3,4]);ctx.beginPath();ctx.arc(ptrF[0],ptrF[1],r,0,TAU);ctx.stroke();ctx.setLineDash([]);}
  drawParticles(ctx,false);
  ctx.restore();
  if(M&&M.type==='soak')drawThermo(ctx);
  drawParticles(ctx,true);
}

let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt,now/1000);draw(now/1000);requestAnimationFrame(loop);}

/* ---------- boot ---------- */
setMuteIcon();hud();requestAnimationFrame(loop);loadArt().then(()=>{buildMask();newCustomer();entry=1;showTitle();});
})();
</script>
